---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/instance: rhoai

resources:

  # Support for GPU Acceleration
  - ../../operator-nfd
  # Device plugin flavor (ClusterPolicy + MIG manager). DRA is off by default: Kueue does not support it for all we need. Use operator-nvidia-gpu/dra for the GPUCluster flavor (and dra.enabled=true in the chart)
  - ../../operator-nvidia-gpu/device-plugin

  # Required for llm-d
  - ../../operator-lws
  - ../../operator-rhcl/overlays/default

  # Required for llm-d autoscaling
  - ../../operator-cma

  # Required for GPUaaS
  - ../../operator-kueue

  # Support for authentication of server models
  # - ../../operator-authorino

  # Support for Training jobs scheduling
  - ../../operator-jobset

  # Support Cluster Observability Operator for MaaS (Perses)
  - ../../operator-coo
  # Perses dashboards in the console (UIPlugin, datasource, dashboards of llm-d, MaaS and RHCL)
  - ../../perses
  - ../../operator-tempo
  - ../../operator-otel

  # MCP gateway (Technology Preview) for the agentic AI of the chart; configured later in the chart
  - ../../operator-mcp-gateway

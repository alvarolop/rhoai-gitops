---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/instance: rhoai

resources:

  # Support for GPU Acceleration
  - ../../operator-nfd
  # DRA flavor. Use operator-nvidia-gpu/device-plugin for the ClusterPolicy with the device plugin and the MIG manager
  - ../../operator-nvidia-gpu/dra

  # Required for llm-d
  - ../../operator-lws
  - ../../operator-rhcl/overlays/default

  # Required for llm-d autoscaling
  - ../../operator-cma

  # Required for GPUaaS
  - ../../operator-kueue

  # Support for authentication of server models
  # - ../../operator-authorino

  # Support for Training jobs scheduling
  - ../../operator-jobset

  # Support Cluster Observability Operator for MaaS (Perses)
  - ../../operator-coo
  # Perses dashboards in the console (UIPlugin, datasource, dashboards of llm-d, MaaS and RHCL)
  - ../../perses
  - ../../operator-tempo
  - ../../operator-otel

---
# Long-lived token of the ServiceAccount; Perses sends it as the bearer token to the Thanos Querier.
apiVersion: v1
kind: Secret
metadata:
  name: thanos-querier-datasource-secret
  namespace: openshift-cluster-observability-operator
  annotations:
    kubernetes.io/service-account.name: perses-thanos-querier
    argocd.argoproj.io/sync-wave: "1"
type: kubernetes.io/service-account-token

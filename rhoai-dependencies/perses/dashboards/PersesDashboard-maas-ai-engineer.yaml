---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: maas-ai-engineer
  namespace: perses-dashboards
  annotations:
    argocd.argoproj.io/sync-wave: '6'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  config:
    display:
      name: 🔷 AI Engineer Dashboard
    duration: 1h
    variables:
    - kind: ListVariable
      spec:
        name: user
        display:
          name: API Key / User
          hidden: false
        allowMultiple: false
        allowAllValue: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: user
            matchers:
            - authorized_hits
        defaultValue: $__all
    panels:
      p1:
        kind: Panel
        spec:
          display:
            name: 📊 Total Tokens
            description: Total API tokens you have consumed that were successfully authorized.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
              thresholds:
                steps: []
                defaultColor: '#56A64B'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(authorized_hits{user=~"^$user$"})
      p11:
        kind: Panel
        spec:
          display:
            name: 📊 Total Requests
            description: Total API requests you have made that were successfully authorized.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
              thresholds:
                steps: []
                defaultColor: '#3274D9'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(authorized_calls{user=~"^$user$"})
      p2:
        kind: Panel
        spec:
          display:
            name: ⚡ Token Rate
            description: Your current token consumption rate (tokens per second) averaged over the last 5 minutes.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: ops/sec
              thresholds:
                steps: []
                defaultColor: '#56A64B'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(authorized_hits{user=~"^$user$"}[5m]))
      p12:
        kind: Panel
        spec:
          display:
            name: ⚡ Request Rate
            description: Your current request rate (requests per second) averaged over the last 5 minutes.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: requests/sec
              thresholds:
                steps: []
                defaultColor: '#3274D9'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(authorized_calls{user=~"^$user$"}[5m]))
      p3:
        kind: Panel
        spec:
          display:
            name: 🚦 Rate Limit Ratio
            description: Percentage of your requests rejected by rate limiting (HTTP 429). High values indicate you are exceeding
              your subscription quota — consider upgrading your subscription or reducing request frequency.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: percent-decimal
              thresholds:
                steps:
                - value: 0.1
                  color: '#F2CC0C'
                - value: 0.3
                  color: '#E02F44'
                defaultColor: '#56A64B'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: (sum(limited_calls{user=~"^$user$"}) / (sum(authorized_calls{user=~"^$user$"}) + sum(limited_calls{user=~"^$user$"})))
                    OR vector(0)
      p8:
        kind: Panel
        spec:
          display:
            name: ✅ Inference Success Rate
            description: 'Model inference success rate: percentage of requests that reached the model and completed successfully.
              This is a platform-wide health indicator (vLLM metrics do not carry per-user labels).'
          plugin:
            kind: GaugeChart
            spec:
              calculation: last
              format:
                unit: percent-decimal
              thresholds:
                steps:
                - value: 0.9
                  color: '#F2CC0C'
                - value: 0.95
                  color: '#56A64B'
                defaultColor: '#E02F44'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: ((sum(rate(vllm:request_success_total[5m])) / sum(rate(vllm:e2e_request_latency_seconds_count[5m])))
                    >= 0) OR vector(1)
      p4:
        kind: Panel
        spec:
          display:
            name: 📈 Token Usage by Model
            description: Your token consumption broken down by model. Shows which models consume the most tokens.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (model) (authorized_hits{user=~"^$user$", model!=""})
                  seriesNameFormat: '{{model}}'
      p5:
        kind: Panel
        spec:
          display:
            name: 📊 Usage Trends (Tokens vs Rate Limited Requests)
            description: Token consumption rate (authorized) and rate-limited request rate over time. Use this to identify
              when you hit rate limits.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: ops/sec
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(authorized_hits{user=~"^$user$"}[5m]))
                  seriesNameFormat: Tokens (authorized)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(limited_calls{user=~"^$user$"}[5m]))
                  seriesNameFormat: Requests (rate limited)
      p9:
        kind: Panel
        spec:
          display:
            name: ⏰ Hourly Token Usage by Model
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: decimal
              visual:
                stack: all
                areaOpacity: 0.5
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (model) (increase(authorized_hits{user=~"^$user$", model!=""}[1h]))
                  seriesNameFormat: '{{model}}'
      p6:
        kind: Panel
        spec:
          display:
            name: 📊 Token Volume by Model (Selected Range)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (model) (increase(authorized_hits{user=~"^$user$", model!=""}[$__range]))
                  seriesNameFormat: '{{model}}'
      p10:
        kind: Panel
        spec:
          display:
            name: ❌ Rate Limited by Subscription (Selected Range)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (subscription) (increase(limited_calls{user=~"^$user$", subscription!=""}[$__range]))
                  seriesNameFormat: '{{subscription}} (limited)'
      p7:
        kind: Panel
        spec:
          display:
            name: 🔍 My Usage Summary by Model & Subscription
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: true
              columnSettings:
              - name: timestamp
                hide: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (model, subscription) (authorized_hits{user=~"^$user$", model!=""})
    layouts:
    - kind: Grid
      spec:
        items:
        - x: 0
          y: 0
          width: 4
          height: 5
          content:
            $ref: '#/spec/panels/p1'
        - x: 4
          y: 0
          width: 4
          height: 5
          content:
            $ref: '#/spec/panels/p11'
        - x: 8
          y: 0
          width: 4
          height: 5
          content:
            $ref: '#/spec/panels/p2'
        - x: 12
          y: 0
          width: 4
          height: 5
          content:
            $ref: '#/spec/panels/p12'
        - x: 16
          y: 0
          width: 4
          height: 5
          content:
            $ref: '#/spec/panels/p3'
        - x: 20
          y: 0
          width: 4
          height: 5
          content:
            $ref: '#/spec/panels/p8'
        display:
          title: 📊 My Usage Summary
          collapse:
            open: true
    - kind: Grid
      spec:
        items:
        - x: 0
          y: 0
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/p4'
        - x: 12
          y: 0
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/p5'
        display:
          title: 📈 Usage Trends
          collapse:
            open: true
    - kind: Grid
      spec:
        items:
        - x: 0
          y: 0
          width: 24
          height: 8
          content:
            $ref: '#/spec/panels/p9'
        display:
          title: ⏰ Hourly Usage Patterns
          collapse:
            open: true
    - kind: Grid
      spec:
        items:
        - x: 0
          y: 0
          width: 24
          height: 8
          content:
            $ref: '#/spec/panels/p6'
        - x: 0
          y: 8
          width: 24
          height: 8
          content:
            $ref: '#/spec/panels/p10'
        - x: 0
          y: 16
          width: 24
          height: 6
          content:
            $ref: '#/spec/panels/p7'
        display:
          title: 🔍 Detailed Analysis
          collapse:
            open: true

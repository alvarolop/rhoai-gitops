                hide: true
              - name: destination_service_name 2
                hide: true
              - name: destination_service_name 3
                hide: true
              - name: destination_service_namespace 1
                hide: true
              - name: destination_service_namespace 2
                hide: true
              - name: destination_service_namespace 3
                hide: true
              - name: destination_version 1
                hide: true
              - name: destination_version 2
                hide: true
              - name: destination_version 3
                hide: true
              - name: destination_workload 1
                hide: true
              - name: destination_workload 2

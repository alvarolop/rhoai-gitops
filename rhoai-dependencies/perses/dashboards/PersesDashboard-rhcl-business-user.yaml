                hide: true
              - name: Time 1
                hide: true
              - name: Time 2
                hide: true
              - name: Time 3
                hide: true
              - name: connection_security_policy 1
                hide: true
              - name: connection_security_policy 2
                hide: true
              - name: connection_security_policy 3
                hide: true
              - name: destination_app 1
                hide: true
              - name: destination_app 2
                hide: true
              - name: destination_app 3
                hide: true
              - name: destination_canonical_revision 1
                hide: true
              - name: destination_canonical_revision 2
                hide: true
              - name: destination_canonical_revision 3
                hide: true
              - name: destination_canonical_service 1
                hide: true
              - name: destination_canonical_service 2
                hide: true
              - name: destination_canonical_service 3
                hide: true
              - name: destination_cluster 1
                hide: true
              - name: destination_cluster 2
                hide: true
              - name: destination_cluster 3
                hide: true
              - name: destination_port 1
                hide: true
              - name: destination_port 2
                hide: true
              - name: destination_port 3

---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: rhcl-business-user
  namespace: perses-dashboards
  annotations:
    argocd.argoproj.io/sync-wave: '6'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  config:
    display:
      name: Business User Dashboard
    duration: 30m
    variables:
    - kind: ListVariable
      spec:
        name: api_namespace
        display:
          name: API/HTTPRoute Namespace
          hidden: false
        allowMultiple: true
        allowAllValue: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: exported_namespace
            matchers:
            - kube_namespace_created
        defaultValue: $__all
    - kind: ListVariable
      spec:
        name: route_name
        display:
          name: API/Route Name
          hidden: false
        allowMultiple: true
        allowAllValue: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: name
            matchers:
            - gatewayapi_httproute_labels
        defaultValue: $__all
    panels:
      p150:
        kind: Panel
        spec:
          display:
            name: Business User Dashboard
          plugin:
            kind: Markdown
            spec:
              text: |
                #### Business Overview of APIs

                The panels below are grouped by APIs, realized by a [Gateway API HTTPRoute](https://gateway-api.sigs.k8s.io/concepts/api-overview/#httproute). Each panel provides a comprehensive overview of request and error metrics associated with each API. Additionally, these panels include a heatmap that visualizes requests per second, offering real-time insights into the traffic patterns and operational status of your services.

                *Important: HTTPRoutes must include a "service" and "deployment" label with a value that matches the name of the service & deployment being routed to. eg. "service=myapp, deployment=myapp"*
      p4:
        kind: Panel
        spec:
          display:
            name: Traffic summary (req/sec)
            description: |-
              Aggregated rate of requests per API (HTTPRoute). The API name can be cross referenced with the API list to see additional details.

              Note: HTTPRoutes require a label `deployment` with the name of the corresponding Deployment so that istio request metrics can be paired with HTTPRoute metrics.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: requests/sec
                  decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(istio_requests_total{}[5m])) by (destination_service_name) * on(destination_service_name)
                    group_right() (group without(instance, app_kubernetes_io_instance) (label_replace(gatewayapi_httproute_labels{name=~"${route_name}",exported_namespace=~"${api_namespace}"},
                    "destination_service_name", "$1","service", "(.+)")))
                  seriesNameFormat: 'API: {{name}}'
      p22:
        kind: Panel
        spec:
          display:
            name: Historical request comparison (req/sec)
            description: req/s Heatmap
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(istio_requests_total{}[5m])) by (destination_service_name) * on(destination_service_name)
                    group_right() (group without(instance, app_kubernetes_io_instance) (label_replace(gatewayapi_httproute_labels{name=~"${route_name}",exported_namespace=~"${api_namespace}"},
                    "destination_service_name", "$1","service", "(.+)")))
                  seriesNameFormat: most recent
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(istio_requests_total{}[5m] offset $__range)) by (destination_service_name) * on(destination_service_name)
                    group_right() (group without(instance, app_kubernetes_io_instance) (label_replace(gatewayapi_httproute_labels{name=~"${route_name}",exported_namespace=~"${api_namespace}"},
                    "destination_service_name", "$1","service", "(.+)")))
                  seriesNameFormat: previous
      p7:
        kind: Panel
        spec:
          display:
            name: Breakdown by path (req/sec)
            description: Aggregated rate of requests per endpoint/path.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: requests/sec
                  decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(istio_requests_total{}[5m])) by (destination_service_name, request_url_path) * on(destination_service_name)
                    group_left() (group without(instance, app_kubernetes_io_instance) (label_replace(gatewayapi_httproute_labels{name=~"${route_name}",exported_namespace=~"${api_namespace}"},
                    "destination_service_name", "$1","service", "(.+)")))
                  seriesNameFormat: '{{request_url_path}}'
      p155:
        kind: Panel
        spec:
          display:
            name: Total requests for selected range
          plugin:
            kind: Table

---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: maas-platform-admin
  namespace: perses-dashboards
  annotations:
    argocd.argoproj.io/sync-wave: '6'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  config:
    display:
      name: 🔷 Platform Admin Dashboard
    duration: 1h
    variables:
    - kind: ListVariable
      spec:
        name: maas_namespace
        display:
          name: MaaS Namespace
          hidden: false
        allowMultiple: false
        allowAllValue: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: namespace
            matchers:
            - kube_pod_info{pod=~"maas-api.*"}
    - kind: TextVariable
      spec:
        name: kuadrant_namespace
        value: kuadrant-system
        display:
          name: Kuadrant Namespace
          hidden: false
    - kind: TextVariable
      spec:
        name: gateway_namespace
        value: openshift-ingress
        display:
          name: Gateway Namespace
          hidden: false
    - kind: TextVariable
      spec:
        name: llm_namespace
        value: llm
        display:
          name: LLM Namespace
          hidden: false
    - kind: ListVariable
      spec:
        name: model
        display:
          name: Model
          hidden: false
        allowMultiple: true
        allowAllValue: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: model_name
            matchers:
            - vllm:num_requests_running
        defaultValue: $__all
    panels:
      p10:
        kind: Panel
        spec:
          display:
            name: 💚 Limitador
            description: Shows if Limitador (rate limiting service) is running. Green = healthy, Red = down. Uses max() to
              deduplicate across scrape sources (PodMonitor + headless service auto-discovery).
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
              thresholds:
                steps:
                - value: 1
                  color: '#56A64B'
                defaultColor: '#E02F44'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: max(limitador_up)
      p11:
        kind: Panel
        spec:
          display:
            name: 🔐 Authorino
            description: Count of running Authorino pods (authentication/authorization service). Should be >= 1.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
              thresholds:
                steps:
                - value: 1
                  color: '#56A64B'
                defaultColor: '#E02F44'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: count(kube_pod_status_phase{namespace=~"$kuadrant_namespace", pod=~"authorino.*", phase="Running"})
                    OR vector(0)
      p12:
        kind: Panel
        spec:
          display:
            name: 🌐 MaaS API Pods
            description: Count of running MaaS API pods. These handle token generation and model routing.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
              thresholds:
                steps:
                - value: 1
                  color: '#56A64B'
                defaultColor: '#E02F44'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: count(kube_pod_status_phase{namespace=~"$maas_namespace", pod=~"maas-api.*", phase="Running"} ==
                    1) OR on() vector(0)
      p13:
        kind: Panel
        spec:
          display:
            name: 🚪 Gateway Pods
            description: Count of running Istio Gateway pods. These are the entry point for all API traffic.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
              thresholds:
                steps:
                - value: 1
                  color: '#56A64B'
                defaultColor: '#E02F44'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: count(kube_pod_status_phase{namespace=~"$gateway_namespace", pod=~"maas-default-gateway.*", phase="Running"}
                    == 1) OR on() vector(0)
      p200:
        kind: Panel
        spec:
          display:
            name: 🚨 Firing Alerts
            description: Number of currently firing Prometheus alerts for MaaS components. 0 = healthy.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
              thresholds:
                steps:
                - value: 1
                  color: '#F2CC0C'
                - value: 3
                  color: '#E02F44'
                defaultColor: '#56A64B'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: count(ALERTS{alertstate="firing", alertname!="Watchdog", namespace=~"$llm_namespace|$kuadrant_namespace|$maas_namespace|envoy-gateway-system"})
                    OR vector(0)
      p201:
        kind: Panel
        spec:
          display:
            name: 📋 Active Alerts
            description: List of currently firing Prometheus alerts for MaaS-related namespaces. Excludes the 'Watchdog' heartbeat
              alert.
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: true
              columnSettings:
              - name: timestamp
                hide: true
              - name: alertname
                header: Alert
                enableSorting: true
              - name: severity
                header: Severity
                enableSorting: true
              - name: namespace
                header: Namespace
                enableSorting: true
              - name: __name__
                hide: true
              - name: alertstate
                hide: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: ALERTS{alertstate="firing", alertname!="Watchdog", namespace=~"$llm_namespace|$kuadrant_namespace|$maas_namespace|envoy-gateway-system"}
      p1:
        kind: Panel
        spec:
          display:
            name: 📊 Total Tokens
            description: Total tokens consumed by successful API requests.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
              thresholds:
                steps: []
                defaultColor: '#56A64B'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(authorized_hits)
      p38:
        kind: Panel
        spec:
          display:
            name: 📊 Total Requests
            description: Total API requests that were successfully authorized.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
              thresholds:
                steps: []
                defaultColor: '#3274D9'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(authorized_calls)
      p3:
        kind: Panel
        spec:
          display:
            name: ⚡ Token Rate
            description: Current token consumption rate (tokens per second) averaged over the last 5 minutes.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: ops/sec
              thresholds:
                steps: []
                defaultColor: '#56A64B'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(authorized_hits[5m]))
      p39:
        kind: Panel
        spec:
          display:
            name: ⚡ Request Rate
            description: Current request rate (requests per second) averaged over the last 5 minutes.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: requests/sec
              thresholds:
                steps: []
                defaultColor: '#3274D9'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(authorized_calls[5m]))
      p4:
        kind: Panel
        spec:
          display:
            name: ✅ Inference Success Rate
            description: 'Model inference success rate: requests that completed successfully / total requests that reached
              the model. Rate-limited requests (429) are excluded — they never reach the model and are tracked separately
              in the Rate Limit Ratio panel.'
          plugin:
            kind: GaugeChart
            spec:
              calculation: last
              format:
                unit: percent-decimal
              thresholds:
                steps:
                - value: 0.9
                  color: '#F2CC0C'
                - value: 0.95
                  color: '#56A64B'
                defaultColor: '#E02F44'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: ((sum(rate(vllm:request_success_total[5m])) / sum(rate(vllm:e2e_request_latency_seconds_count[5m])))
                    >= 0) OR vector(1)
      p14:
        kind: Panel
        spec:
          display:
            name: 👥 Active Users
            description: Unique users with at least one successful request (aligns with maas_subscription_active_users concept;
              platform total).
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
              thresholds:
                steps: []
                defaultColor: '#56A64B'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: count(count by (user) (authorized_calls))
      p17:
        kind: Panel
        spec:
          display:
            name: ⏱️ P50 Response Latency
            description: Median (50th percentile) response latency measured at the gateway over a 15m window. 50% of requests
              complete faster than this value.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: milliseconds
              thresholds:
                steps:
                - value: 100
                  color: '#F2CC0C'
                - value: 500
                  color: '#E02F44'
                defaultColor: '#56A64B'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.5, sum(rate(istio_request_duration_milliseconds_bucket[15m])) by (le))
      p40:
        kind: Panel
        spec:
          display:
            name: 🚦 Rate Limit Ratio
            description: Percentage of gateway requests rejected by rate limiting (HTTP 429). High values indicate users are
              exceeding their subscription quotas — consider adjusting rate limits or upgrading subscriptions. This is a capacity
              planning signal, not a system health issue.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: percent-decimal
              thresholds:
                steps:
                - value: 0.1
                  color: '#F2CC0C'
                - value: 0.3
                  color: '#E02F44'
                defaultColor: '#56A64B'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: (sum(limited_calls) / (sum(authorized_calls) + sum(limited_calls))) OR vector(0)
      p52:
        kind: Panel
        spec:
          display:
            name: 🔐 Auth Evaluation Latency (P50/P95/P99)
            description: Authentication/authorization evaluation latency (P50/P95/P99). Shows how long Authorino takes to
              evaluate each request. High latency here adds directly to overall request latency. Requires the authorino-server-metrics
              ServiceMonitor.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.5, sum(rate(auth_server_authconfig_duration_seconds_bucket[5m])) by (le))
                  seriesNameFormat: P50
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.95, sum(rate(auth_server_authconfig_duration_seconds_bucket[5m])) by (le))
                  seriesNameFormat: P95
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.99, sum(rate(auth_server_authconfig_duration_seconds_bucket[5m])) by (le))
                  seriesNameFormat: P99
      p53:
        kind: Panel
        spec:
          display:
            name: 🔐 Auth Success / Deny Rate
            description: Rate of auth evaluation outcomes from Authorino. Shows successful authentications vs denials over
              time. A rising denial rate may indicate misconfigured policies or an attack. Requires the authorino-server-metrics
              ServiceMonitor.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: ops/sec
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (status) (rate(auth_server_authconfig_response_status[5m]))
                  seriesNameFormat: '{{status}}'
      p5:
        kind: Panel
        spec:
          display:
            name: 📈 Token Rate by Model
            description: Token consumption rate (tokens/s) broken down by model. Shows which models consume the most tokens.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: ops/sec
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (model) (rate(authorized_hits{model!=""}[5m]))
                  seriesNameFormat: '{{model}}'
      p6:
        kind: Panel
        spec:
          display:
            name: ❌ Overall Error Rate
            description: Error rates by type. 4xx = client errors excluding 429 (401 auth, 400 bad request), 5xx = server
              errors, Rate Limited = 429 quota exceeded (from Limitador).
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: ops/sec
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(istio_requests_total{response_code=~"4..", response_code!="429"}[5m])) OR vector(0)
                  seriesNameFormat: 4xx Errors (excl. 429)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(istio_requests_total{response_code=~"5.."}[5m])) OR vector(0)
                  seriesNameFormat: 5xx Errors
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(limited_calls[5m])) OR vector(0)
                  seriesNameFormat: 429 Rate Limited
      p7:
        kind: Panel
        spec:
          display:
            name: 📊 Token Consumption by Subscription
            description: 'Token consumption rate (tokens/s) by subscription (aligns with Token Consumption by Subscription;
              metric: authorized_hits).'
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: ops/sec
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (subscription) (rate(authorized_hits[5m]))
                  seriesNameFormat: '{{subscription}}'
      p19:
        kind: Panel
        spec:
          display:
            name: 📈 Request Volume by Subscription
            description: 'Request rate (req/s) by subscription (aligns with Request Volume by Subscription; metric: authorized_calls).'
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: requests/sec
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (subscription) (rate(authorized_calls[5m]))
                  seriesNameFormat: '{{subscription}}'
      p18:
        kind: Panel
        spec:
          display:
            name: ⏱️ P95 Latency by Service
            description: 95th percentile latency per backend service. Excludes 'unknown' (404s to non-existent paths).
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: milliseconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.95, sum by (destination_service_name, le) (rate(istio_request_duration_milliseconds_bucket{destination_service_name!="unknown"}[5m])))
                  seriesNameFormat: '{{destination_service_name}}'
      p20:
        kind: Panel
        spec:
          display:
            name: 🚫 Rate Limit Violations by Subscription
            description: 'Rate limit violations (HTTP 429) by subscription (aligns with Rate Limit Violations; metric: limited_calls).'
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: ops/sec
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (subscription) (rate(limited_calls[5m]))
                  seriesNameFormat: '{{subscription}}'
      p15:
        kind: Panel
        spec:
          display:
            name: 🚫 Rate Limited Requests
            description: Rate of requests that exceeded quota and received HTTP 429 (Too Many Requests). High values indicate
              users are hitting their rate limits.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: ops/sec
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(limited_calls[5m]))
                  seriesNameFormat: Rate Limited
      p16:
        kind: Panel
        spec:
          display:
            name: 🔒 Unauthorized Requests
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: ops/sec
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(istio_requests_total{response_code="401"}[5m])) OR vector(0)
                  seriesNameFormat: Unauthorized (401)
      p21:
        kind: Panel
        spec:
          display:
            name: 🔄 Requests Running
            description: Number of inference requests currently being processed by the model. High values indicate the model
              is busy.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
              thresholds:
                steps:
                - value: 5
                  color: '#F2CC0C'
                - value: 10
                  color: '#E02F44'
                defaultColor: '#56A64B'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(vllm:num_requests_running)
      p22:
        kind: Panel
        spec:
          display:
            name: ⏳ Requests Waiting
            description: Number of inference requests waiting in queue. Growing queue indicates model is overloaded and needs
              scaling.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
              thresholds:
                steps:
                - value: 10
                  color: '#F2CC0C'
                - value: 50
                  color: '#E02F44'
                defaultColor: '#56A64B'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(vllm:num_requests_waiting)
      p23:
        kind: Panel
        spec:
          display:
            name: 💾 GPU Cache Usage
            description: Percentage of GPU KV-cache in use. High values (>90%) may cause request queuing. Consider increasing
              GPU memory or scaling replicas.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: percent-decimal
              thresholds:
                steps:
                - value: 0.7
                  color: '#F2CC0C'
                - value: 0.9
                  color: '#E02F44'
                defaultColor: '#56A64B'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: avg(vllm:kv_cache_usage_perc)
      p24:
        kind: Panel
        spec:
          display:
            name: 📊 Total Requests
            description: Total inference requests processed by the model in the selected time range.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
              thresholds:
                steps: []
                defaultColor: '#3274D9'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(increase(vllm:e2e_request_latency_seconds_count{model_name=~"$model"}[$__range]))
      p25:
        kind: Panel
        spec:
          display:
            name: 📊 Model Queue Depth
            description: Running and waiting requests per model over time. Consistently growing waiting queues indicate scaling
              is needed.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (model_name) (vllm:num_requests_running{model_name=~"$model"})
                  seriesNameFormat: '{{model_name}} running'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (model_name) (vllm:num_requests_waiting{model_name=~"$model"})
                  seriesNameFormat: '{{model_name}} waiting'
      p26:
        kind: Panel
        spec:
          display:
            name: ⏱️ Model Inference Latency
            description: End-to-end model inference latency (P50/P95/P99). Measured from request received to response complete.
              Includes queue time + processing time.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.5, sum(rate(vllm:e2e_request_latency_seconds_bucket{model_name=~"$model"}[5m]))
                    by (le, model_name))
                  seriesNameFormat: '{{model_name}} P50'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.95, sum(rate(vllm:e2e_request_latency_seconds_bucket{model_name=~"$model"}[5m]))
                    by (le, model_name))
                  seriesNameFormat: '{{model_name}} P95'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.99, sum(rate(vllm:e2e_request_latency_seconds_bucket{model_name=~"$model"}[5m]))
                    by (le, model_name))
                  seriesNameFormat: '{{model_name}} P99'
      p27:
        kind: Panel
        spec:
          display:
            name: 🔤 Tokens (1h)
            description: Total prompt + generation tokens processed in the last hour across all models.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
              thresholds:
                steps: []
                defaultColor: '#56A64B'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(increase(vllm:request_prompt_tokens_sum{model_name=~"$model"}[1h])) + sum(increase(vllm:request_generation_tokens_sum{model_name=~"$model"}[1h]))
      p28:
        kind: Panel
        spec:
          display:
            name: 🔤 Token Throughput
            description: Token processing rate. Prompt = input tokens, Generation = output tokens. Higher is better for throughput.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(vllm:request_prompt_tokens_sum{model_name=~"$model"}[5m]))
                  seriesNameFormat: Prompt tokens/s
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(vllm:request_generation_tokens_sum{model_name=~"$model"}[5m]))
                  seriesNameFormat: Generation tokens/s
      p50:
        kind: Panel
        spec:
          display:
            name: 📊 Prompt vs Generation Token Ratio
            description: Ratio of prompt (input) tokens to total tokens per model. Values close to 1.0 mean users send large
              contexts with little generation; values close to 0 mean mostly output tokens. Helps identify prompt-heavy vs
              generation-heavy workloads for capacity planning.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: percent-decimal
                min: 0
                max: 1
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: (sum by (model_name) (rate(vllm:request_prompt_tokens_sum{model_name=~"$model"}[5m]))) / clamp_min(sum
                    by (model_name) (rate(vllm:request_prompt_tokens_sum{model_name=~"$model"}[5m])) + sum by (model_name)
                    (rate(vllm:request_generation_tokens_sum{model_name=~"$model"}[5m])), 1e-9) and (sum by (model_name) (rate(vllm:request_prompt_tokens_sum{model_name=~"$model"}[5m]))
                    + sum by (model_name) (rate(vllm:request_generation_tokens_sum{model_name=~"$model"}[5m]))) > 0
                  seriesNameFormat: '{{model_name}}'
      p51:
        kind: Panel
        spec:
          display:
            name: ⏳ Queue Wait Time
            description: Time requests spend waiting in the model's queue before processing begins (P50/P95/P99). Rising queue
              wait times are a critical signal that the model needs scaling. Requires vLLM or llm-d serving backend with queue
              metrics enabled.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.5, sum(rate(vllm:request_queue_time_seconds_bucket{model_name=~"$model"}[5m]))
                    by (le, model_name))
                  seriesNameFormat: '{{model_name}} P50'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.95, sum(rate(vllm:request_queue_time_seconds_bucket{model_name=~"$model"}[5m]))
                    by (le, model_name))
                  seriesNameFormat: '{{model_name}} P95'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.99, sum(rate(vllm:request_queue_time_seconds_bucket{model_name=~"$model"}[5m]))
                    by (le, model_name))
                  seriesNameFormat: '{{model_name}} P99'
      p36:
        kind: Panel
        spec:
          display:
            name: ⚡ Time to First Token (TTFT)
            description: Time to First Token (TTFT) over time. Shows P50, P95, and P99 percentiles. TTFT measures how quickly
              the model starts generating output - critical for streaming user experience.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.5, sum(rate(vllm:time_to_first_token_seconds_bucket{model_name=~"$model"}[5m]))
                    by (le, model_name))
                  seriesNameFormat: '{{model_name}} P50'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.95, sum(rate(vllm:time_to_first_token_seconds_bucket{model_name=~"$model"}[5m]))
                    by (le, model_name))
                  seriesNameFormat: '{{model_name}} P95'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.99, sum(rate(vllm:time_to_first_token_seconds_bucket{model_name=~"$model"}[5m]))
                    by (le, model_name))
                  seriesNameFormat: '{{model_name}} P99'
      p37:
        kind: Panel
        spec:
          display:
            name: ⚡ Inter-Token Latency (ITL)
            description: Inter-Token Latency (ITL) over time. Shows P50, P95, and P99 percentiles. ITL measures the time between
              consecutive output tokens - affects perceived 'typing speed' during streaming.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.5, sum(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$model"}[5m]))
                    by (le, model_name))
                  seriesNameFormat: '{{model_name}} P50'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.95, sum(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$model"}[5m]))
                    by (le, model_name))
                  seriesNameFormat: '{{model_name}} P95'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.99, sum(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$model"}[5m]))
                    by (le, model_name))
                  seriesNameFormat: '{{model_name}} P99'
      p34:
        kind: Panel
        spec:
          display:
            name: 🏆 Top 10 Users by Token Usage
            description: Top 10 users ranked by total tokens consumed. Helps identify your highest-consuming users.
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: true
              columnSettings:
              - name: timestamp
                hide: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: topk(10, sum by (user) (authorized_hits{user!=""}))
      p35:
        kind: Panel
        spec:
          display:
            name: 🏆 Top 10 Users by Declined Requests
            description: Top 10 users ranked by rate-limited requests (HTTP 429). High counts may indicate users need a higher
              subscription tier or are experiencing quota issues.
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: true
              columnSettings:
              - name: timestamp
                hide: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: topk(10, sum by (user) (limited_calls{user!=""}))
      p8:
        kind: Panel
        spec:
          display:
            name: 👥 Token Rate by User
            description: Token consumption rate (tokens/s) broken down by individual user. Shows usage patterns over time.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: ops/sec
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (user) (rate(authorized_hits[5m]))
                  seriesNameFormat: '{{user}}'
      p9:
        kind: Panel
        spec:
          display:
            name: 📋 Request Volume by User & Subscription
            description: Request count by user and subscription. Excludes anonymous/internal requests (no user label). The
              model label is not available on authorized_calls; use authorized_hits for per-model token breakdown.
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: true
              columnSettings:
              - name: timestamp
                hide: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (user, subscription) (authorized_calls{user!=""})
      p29:
        kind: Panel
        spec:
          display:
            name: 📦 Resource Allocation per Model
            description: Resource requests/limits for LLM model pods. GPU column shows requested GPUs (nvidia.com/gpu or amd.com/gpu).
              For GPU utilization metrics, DCGM Exporter must be installed. See 'GPU Cache Usage' panel above for vLLM's KV-cache
              utilization.
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: true
              columnSettings:
              - name: timestamp
                hide: true
              - name: Time 1
                hide: true
              - name: Time 2
                hide: true
              - name: Time 3
                hide: true
              - name: Time 4
                hide: true
              - name: Time 5
                hide: true
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: max by (pod) (kube_pod_container_resource_requests{namespace=~"$llm_namespace", resource="cpu"})
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: max by (pod) (kube_pod_container_resource_limits{namespace=~"$llm_namespace", resource="cpu"})
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: max by (pod) (kube_pod_container_resource_requests{namespace=~"$llm_namespace", resource="memory"})
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: max by (pod) (kube_pod_container_resource_limits{namespace=~"$llm_namespace", resource="memory"})
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: max by (pod) (kube_pod_container_resource_requests{namespace=~"$llm_namespace", resource=~"nvidia.com/gpu|amd.com/gpu"})
      p30:
        kind: Panel
        spec:
          display:
            name: 👤 Token Usage & Rate Limits per User
            description: Per-user metrics. Shows token consumption rate (authorized_hits) vs rate-limited requests (HTTP 429)
              per user over time.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: ops/sec
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (user) (rate(authorized_hits[5m]))
                  seriesNameFormat: '{{user}} (tokens/s)'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (user) (rate(limited_calls[5m]))
                  seriesNameFormat: '{{user}} (429 Rate Limited)'
      p31:
        kind: Panel
        spec:
          display:
            name: ⏱️ Latency per Subscription (P50 / P95 / P99)
            description: |-
              P50 / P95 / P99 latency per subscription.

              The subscription label is added via Istio Telemetry reading the X-MaaS-Subscription header injected by AuthPolicy.
              Per-user latency is not on the histogram to keep cardinality bounded.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: milliseconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.5, sum by (subscription, le) (rate(istio_request_duration_milliseconds_bucket{subscription!="",subscription!="unknown"}[5m])))
                  seriesNameFormat: '{{subscription}} P50'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.95, sum by (subscription, le) (rate(istio_request_duration_milliseconds_bucket{subscription!="",subscription!="unknown"}[5m])))
                  seriesNameFormat: '{{subscription}} P95'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.99, sum by (subscription, le) (rate(istio_request_duration_milliseconds_bucket{subscription!="",subscription!="unknown"}[5m])))
                  seriesNameFormat: '{{subscription}} P99'
      p32:
        kind: Panel
        spec:
          display:
            name: ⏱️ P95 Latency per Model
            description: |-
              P95 latency per model (backend service).

              Each KServe model gets a dedicated service, so destination_service_name maps directly to the model. Shows how each model's response time compares.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: milliseconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.95, sum by (destination_service_name, le) (rate(istio_request_duration_milliseconds_bucket{destination_service_name!="",destination_service_name!="unknown"}[5m])))
                  seriesNameFormat: '{{destination_service_name}}'
      p33:
        kind: Panel
        spec:
          display:
            name: 📊 Token Volume by Subscription
            description: |-
              Token consumption per subscription over time (stacked).

              Shows absolute token volume per subscription as stacked bars. The height of each bar is the total tokens consumed in that interval; the stacking shows the subscription proportion.

              For per-user billing, use the AI Engineer dashboard or query Prometheus:
                sum by (user) (increase(authorized_hits[24h]))
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: decimal
              visual:
                stack: all
                areaOpacity: 0.5
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (subscription) (increase(authorized_hits{subscription!=""}[5m]))
                  seriesNameFormat: '{{subscription}}'

      p141:
        kind: Panel
        spec:
          display:
            name: CPU Usage
            description: CPU Usage of all workloads (Deployments) linked to a HTTPRoute. That is, they have a corresponding
              HTTPRoute with a deployment label.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: decimal
                min: 0
              visual:
                stack: all
                areaOpacity: 0.5
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(
                      node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{exported_namespace=~"$api_policy_namespace"}
                    * on(namespace, exported_namespace,pod)
                      group_left(workload, workload_type) namespace_workload_pod:kube_pod_owner:relabel{exported_namespace=~"$api_policy_namespace", workload_type="deployment"}
                    ) by (workload, workload_type)
                    * on(workload) (group by(workload) (label_replace(gatewayapi_httproute_labels{exported_namespace=~"$api_policy_namespace",name=~"$route_name"}, "workload", "$1","deployment", "(.+)")))
                  seriesNameFormat: 'API: {{workload}}'
      p143:
        kind: Panel
        spec:
          display:
            name: Memory Usage
            description: Memory Usage of all workloads (Deployments) linked to a HTTPRoute. That is, they have a corresponding
              HTTPRoute with a deployment label.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                position: bottom
                mode: list
              yAxis:
                format:
                  unit: bytes
                min: 0
              visual:
                stack: all
                areaOpacity: 0.5
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(
                        container_memory_working_set_bytes{metrics_path="/metrics/cadvisor", exported_namespace=~"$api_policy_namespace", container!="", image!=""}
                      * on(namespace, exported_namespace,pod)
                        group_left(workload, workload_type) namespace_workload_pod:kube_pod_owner:relabel{exported_namespace=~"$api_policy_namespace", workload_type="deployment"}
                    ) by (workload, workload_type)
                    * on(workload) (group by(workload) (label_replace(gatewayapi_httproute_labels{exported_namespace=~"$api_policy_namespace",name=~"$route_name"}, "workload", "$1","deployment", "(.+)")))
                  seriesNameFormat: 'API: {{workload}}'

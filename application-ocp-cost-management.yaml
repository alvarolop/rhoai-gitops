---
# Cost Management Metrics Operator: uploads usage to Red Hat Hybrid Cloud Console (console.redhat.com)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app: ocp-cost-management
  name: ocp-cost-management
  namespace: openshift-gitops
spec:
  destination:
    server: 'https://kubernetes.default.svc'
  project: default
  source:
    path: addons/ocp-cost-management
    repoURL: https://github.com/alvarolop/rhoai-gitops.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions: []

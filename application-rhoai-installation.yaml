---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app: rhoai-installation
  name: rhoai-installation
  namespace: openshift-gitops
spec:
  destination:
    server: 'https://kubernetes.default.svc'
  project: default
  source:
    repoURL: https://github.com/alvarolop/rhoai-gitops.git
    targetRevision: main
    path: rhoai-installation-chart
    helm:
      values: |
        global:
          culling:
            enabled: true
          clusterDomain: "$CLUSTER_DOMAIN"

        modelRegistry:
          enabled: true
        
        distributedWorkloads:
          enabled: true

        ogx:
          enabled: true
        
        mlflow:
          enabled: true
          artifacts:
            s3:
              enabled: $MLFLOW_S3_ENABLED
              endpoint: "http://s4.$S4_NAMESPACE.svc.cluster.local:7480"
              region: "$S4_S3_REGION"
              accessKey: "$S4_S3_ACCESS_KEY"
              secretKey: "$S4_S3_SECRET_KEY"
        
        trustyai:
          enabled: true
        
        featureStore:
          enabled: true
          # Examples (sample, banking) are defined in the chart values
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions: []

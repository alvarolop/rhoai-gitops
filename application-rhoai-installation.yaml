---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app: rhoai-installation
  name: rhoai-installation
  namespace: openshift-gitops
spec:
  destination:
    server: 'https://kubernetes.default.svc'
  project: default
  source:
    repoURL: https://github.com/alvarolop/rhoai-gitops.git
    targetRevision: main
    path: rhoai-installation-chart
    helm:
      values: |
        global:
          culling:
            enabled: true
          clusterDomain: "$CLUSTER_DOMAIN"

        modelRegistry:
          enabled: true
        
        distributedWorkloads:
          enabled: true

        llamaStack:
          enabled: true
        
        mlflow:
          enabled: true
        
        trustyai:
          enabled: true
        
        featureStore:
          enabled: true
          # Examples (sample, banking) are defined in the chart values
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions: []

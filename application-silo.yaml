---
# Silo: community-maintained fork of MinIO (https://silo.pgsty.com), deployed with the chart in its repository
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app: silo
  name: silo
  namespace: openshift-gitops
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: $SILO_NAMESPACE
  project: default
  sources:
    - repoURL: https://github.com/pgsty/silo.git
      targetRevision: RELEASE.2026-11-12T00-00-00Z
      path: helm/silo
      helm:
        releaseName: silo
        values: |
          mode: standalone
          replicas: 1
          rootUser: "$SILO_ADMIN_USERNAME"
          rootPassword: "$SILO_ADMIN_PASSWORD"
          persistence:
            size: 20Gi
          resources:
            requests:
              memory: 512Mi
          # OpenShift: the chart fixes UID/fsGroup 1000, which the restricted-v2 SCC rejects
          securityContext:
            enabled: false
    # Routes and ConsoleLink
    - repoURL: https://github.com/alvarolop/rhoai-gitops.git
      targetRevision: main
      path: addons/silo
      helm:
        values: |
          clusterDomain: $CLUSTER_DOMAIN
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true

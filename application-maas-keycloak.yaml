---
# Second MaaS tenant: its own Gateway, Route and AITenant whose users sign in with Keycloak (INSTALL_KEYCLOAK in auto-install.sh).
# It is a separate Application on purpose: a problem here (a subscription rejected until the controller has created the MaasTenantConfig,
# an AITenant stuck Pending) cannot block the sync of rhoai-installation, which holds the default tenant, or show it as degraded.
# Needs rhoai-installation (MaaS, and the namespace ai-tenant-maas-keycloak with modelsAsService.keycloak.enabled) and the Keycloak of
# application-keycloak.yaml (realm maas, client maas). Technology Preview in RHOAI 3.5.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app: maas-keycloak
  name: maas-keycloak
  namespace: openshift-gitops
spec:
  destination:
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/alvarolop/rhoai-gitops.git
    targetRevision: main
    path: maas-keycloak-chart
    helm:
      values: |
        global:
          clusterDomain: "$CLUSTER_DOMAIN"

        # Subscriptions of the tenant: groups are the Keycloak group names exactly as in the token. They need the MaaSModelRef of
        # each model (rhoai-serving, serving.maas.tenant) to exist, so they are added when the models are deployed.
        # configs:
        #   - name: acme-support
        #     groups: [acme-support]
        #     models:
        #       - name: gemma-4-12b-it-fp8-dynamic
        #         tokenRateLimits:
        #           - limit: 10000
        #             window: 1h
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    # The tenant subscriptions are rejected by the admission webhook until the controller has created the MaasTenantConfig
    # of the AITenant: retry instead of leaving the first sync failed
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m

---
# create one installplan-approver job per manual operator
apiVersion: batch/v1
kind: Job
metadata:
  name: enable-console-plugin
  annotations:
    # A Job cannot change its image in place, so Argo CD recreates it on every sync
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  namespace: openshift-storage
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 10
  activeDeadlineSeconds: 240
  template:
    spec:
      containers:
      - name: secret-creation
        image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
        imagePullPolicy: Always
        command:
          - /bin/bash
          - -c
          - |
            if ! oc get console.operator.openshift.io cluster -o yaml  | grep "odf-console";
            then
              oc patch console.operator.openshift.io cluster --type=json \
              --patch '[{"op":"add","path":"/spec/plugins/-","value":"odf-console"}]'
            fi
      dnsPolicy: ClusterFirst
      restartPolicy: Never
      serviceAccountName: job-enable-console-plugin
      terminationGracePeriodSeconds: 30

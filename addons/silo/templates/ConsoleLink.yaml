{{- if .Values.clusterDomain }}
---
apiVersion: console.openshift.io/v1
kind: ConsoleLink
metadata:
  name: {{ .Release.Namespace }}-silo
spec:
  href: "https://silo-ui-{{ .Release.Namespace }}.apps.{{ .Values.clusterDomain }}"
  location: ApplicationMenu
  text: "Silo | S3 console"
  applicationMenu:
    section: OpenShift Self Managed Services
    imageURL: "https://silo.pgsty.com/img/silo.svg"
{{- end }}

# Default values for rhoai-installation-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  culling:
    enabled: true
  # DNS segment after apps. in route hostnames (e.g. ocp.sandbox3642.opentlc.com for *.apps.ocp.sandbox3642.opentlc.com).
  clusterDomain: "ocp.sandbox437.opentlc.com"

modelRegistry:
  enabled: true

# Kueue queues (templates/04-kueue): default-cq (workbenches, CPU), serving-cq (models) and batch-cq (jobs on spot GPU).
# The quotas are in each ClusterQueue file, sized for a test cluster with one GPU (g6.2xlarge) and three 15.5 CPU / 58 GiB workers.
distributedWorkloads:
  enabled: true
  # Namespaces that get the LocalQueues (default, serving-lq, batch-lq). Each one must already exist and carry the label
  # kueue.openshift.io/managed=true (this chart sets it on models-as-a-service and, with training.enabled, on rhoai-training: if you turn training off, remove it from this list).
  localQueueNamespaces:
    - models-as-a-service
    - rhoai-training

# OGX (formerly Llama Stack): the server behind the Gen AI Studio playground (RAG, vector stores, agents). This chart always
# enables Gen AI Studio, so keep it on.
ogx:
  enabled: true

# Agentic AI of OpenShift AI 3.5 (Developer Preview, not supported), all in one flag: MCP (lifecycle operator, MCP Catalog
# and Registry), Agents Catalog, saved agents and Agent Ops in Gen AI Studio, and custom AI asset endpoints.
# The playground agents need ogx on.
agentic:
  enabled: true

# Training with Kubeflow Trainer v2 (TrainJob): enables the trainer component and creates the rhoai-training project,
# a Kueue namespace; its LocalQueues come from distributedWorkloads.localQueueNamespaces. The jobs are not part of the chart.
training:
  enabled: true

# Models-as-a-Service: aigateway.modelsAsAService plus the maas-default-gateway GatewayClass
modelsAsService:
  enabled: true
  namespace: models-as-a-service
  # true: its own PostgreSQL (rhoai-maas-db) for the MaaS API; false: provide the maas-db-config secret yourself
  postgresql:
    enabled: true
    password: SecurePassword123  # Change for production
    storageSize: 20Gi
  # Demo content (templates/12-maas-demo): the simulator model and the sample subscriptions below. Turn it off to put your own on top
  demo:
    enabled: true
  # Subscriptions for models that live outside this chart (for example the ones from rhoai-serving). Empty by default: a
  # subscription whose MaaSModelRef does not exist ends Failed and the dashboard warns "Models as a Service could not be loaded".
  # Each entry creates a MaaSSubscription and a MaaSAuthPolicy. priority picks the default subscription when a user matches
  # several (production 100, staging 50, development 0, sandbox -10).
  configs: []
  # configs:
  #   - name: basic-models
  #     displayName: "Basic Models"
  #     description: "Basic subscription for demo models"
  #     priority: 50
  #     groups:
  #       - cluster-admins
  #     models:
  #       # Simple string format (no rate limits)
  #       - granite-3-3-2b-instruct
  #       # With rate limits. They count prompt and completion tokens; Open WebUI sends extra title/tags requests, so keep them generous
  #       - name: gemma-4-12b-it-fp8-dynamic   # the name of its MaaSModelRef
  #         tokenRateLimits:
  #           - limit: 100000
  #             window: 1h

  # Second MaaS tenant (Technology Preview in RHOAI 3.5): its own Gateway and hostname, and its users sign in with an
  # external OIDC provider (Keycloak) instead of OpenShift identities. The default tenant (models-as-a-service) is not touched.
  # A model joins the tenant with MaaSModelRef spec.tenantRef (rhoai-serving: serving.maas.tenant).
  keycloak:
    enabled: false
    # AITenant name, also the Gateway name. DNS-1123, at most 41 characters. The controller creates the namespace ai-tenant-<name>
    tenantName: maas-keycloak
    # GatewayClass of the tenant Gateway. The doc asks for "openshift-default", which this cluster does not have: the class this
    # chart already creates for the default MaaS gateway (same controller) is reused. Change it if the AITenant stays Pending.
    gatewayClassName: maas-default-gateway
    # Route host of the tenant gateway. Empty = <tenantName>.apps.<global.clusterDomain>
    host: ""
    # Namespace for the models of this tenant, created here with the Kueue and gateway-access labels. It also gets the LocalQueues
    # and the DRA claim templates, so models-as-a-service stays as it is. Deploy the models there (rhoai-serving: namespace.name)
    modelsNamespace: rhoai-models-oidc
    oidc:
      # Empty = https://keycloak-ingress-keycloak.apps.<global.clusterDomain>/realms/maas (the route the Keycloak operator creates)
      issuerUrl: ""
      # Client registered in Keycloak for MaaS (not the dashboard client data-science-gateway). The token needs the groups claim
      clientId: maas
      # Seconds the signing keys (JWKS) are cached: default 300, minimum 30
      ttl: 300
    # Subscriptions of the tenant, same shape as modelsAsService.configs. groups are the Keycloak group names exactly as they
    # appear in the token (for example acme-support, not acme/acme-support). They are created in ai-tenant-<tenantName>.
    configs: []
    # configs:
    #   - name: acme-support
    #     groups: [acme-support]
    #     models:
    #       - name: gemma-4-12b-it-fp8-dynamic   # MaaSModelRef with tenantRef: maas-keycloak, in modelsNamespace
    #         tokenRateLimits:
    #           - limit: 10000
    #             window: 1h

# Dynamic Resource Allocation (templates/06-dra). Needs the DRA flavor of rhoai-dependencies/operator-nvidia-gpu (GPUCluster).
# The pods request a GPU through a ResourceClaimTemplate instead of the nvidia.com/gpu limit (the models come from rhoai-serving).
# The GPU t-shirt sizes (gpu-s-x1, gpu-m-x1, gpu-l-x1, gpu-xl-x1, gpu-xl-x2) are one file each in templates/06-dra.
dra:
  enabled: true
  # Namespaces that get the templates. Default: modelsAsService.namespace, where the models run
  namespaces: []

# Grafana dashboards of llm-d and MaaS (they need the Grafana addon, INSTALL_GRAFANA in auto-install.sh)
grafana:
  enabled: true

llm_d:
  enabled: true
  # Direct llm-d gateway: GatewayClass + ConfigMap service override + Gateway (ClusterIP via
  # infrastructure.parametersRef) + Route (reencrypt, as the gateway of OpenShift AI itself).
  ocpRouteGateway:
    enabled: true

# https://access.redhat.com/articles/7136121
mlflow:
  enabled: true
  # Artifacts go to an S3 bucket (the one S4 serves, created by auto-install.sh); false keeps them on the PVC
  artifacts:
    s3:
      enabled: true
      bucket: mlflow
      endpoint: http://s4.s4.svc.cluster.local:7480
      region: us-east-1
      accessKey: s4admin
      secretKey: s4secret

trustyai:
  enabled: true

evalHub:
  enabled: true
  namespace: rhoai-evalhub  # the 3.4.0 dashboard only found EvalHub in redhat-ods-applications; go back there if it does not show up
  # true: its own PostgreSQL (rhoai-evalhub-db), which keeps the jobs across restarts; false: in-memory SQLite
  postgresql:
    enabled: true
    password: SecurePassword123  # Change for production
    storageSize: 10Gi

# Feast: each enabled example creates a FeatureStore (see the README)
featureStore:
  enabled: true
  namespace: rhoai-feature-store
  examples:
    # Project generated by `feast init`. Other templates: minimal, milvus, ray_rag, pytorch_nlp, postgres, spark...
    - enabled: true
      name: sample
      materializeSchedule: "*/15 * * * *"
      feastProjectDir:
        init:
          template: local
      # persistence:  # for the commented pvc-feature-store-*.yaml templates
      #   online:
      #     size: 5Gi
      #   offline:
      #     size: 5Gi
      #   registry:
      #     size: 5Gi
    # Feature repository from Git; authz.enabled turns on Kubernetes RBAC
    - enabled: false
      name: banking
      authz:
        enabled: false
      materializeSchedule: "*/15 * * * *"
      feastProjectDir:
        git:
          url: https://github.com/alvarolop/banking-feature-store
          ref: rbac
          # featureRepoPath: feature_repo

metalLB:
  enabled: false
  addresses:
    - 192.168.1.100/32

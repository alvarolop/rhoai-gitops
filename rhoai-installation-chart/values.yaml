# Default values for rhoai-installation-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  culling:
    enabled: true
  # DNS segment after apps. in route hostnames (e.g. ocp.sandbox3642.opentlc.com for *.apps.ocp.sandbox3642.opentlc.com).
  clusterDomain: "ocp.sandbox437.opentlc.com"

modelRegistry:
  enabled: true

# Kueue queues (templates/04-kueue): default-cq (workbenches, CPU), serving-cq (models) and batch-cq (jobs on spot GPU).
# The quotas are in each ClusterQueue file, sized for a test cluster with one GPU (g6.2xlarge) and three 15.5 CPU / 58 GiB workers.
distributedWorkloads:
  enabled: true
  # Namespaces that get the LocalQueues (default, serving-lq, batch-lq). Each one must already exist and carry the label
  # kueue.openshift.io/managed=true (this chart sets it on models-as-a-service and, with training.enabled, on rhoai-training: if you turn training off, remove it from this list).
  localQueueNamespaces:
    - models-as-a-service
    - rhoai-training

# OGX (formerly Llama Stack): the server behind the Gen AI Studio playground (RAG, vector stores, agents). This chart always
# enables Gen AI Studio, so keep it on.
ogx:
  enabled: true

# Agentic AI of OpenShift AI 3.5 (Developer Preview, not supported), all in one flag: MCP (lifecycle operator, MCP Catalog
# and Registry), Agents Catalog, saved agents and Agent Ops in Gen AI Studio, and custom AI asset endpoints.
# The playground agents need ogx on.
agentic:
  enabled: true

# NVIDIA NIM (RHOAI native NIM platform): kserve.nim in the DataScienceCluster, the NIM option in the dashboard and the models
# project (templates/14-nim) with its Kueue LocalQueues and DRA claim templates. The namespace is adopted if it already exists.
# The NIM Account CR and the NGC secrets are NOT part of this chart: they belong to github.com/alvarolop/rhoai-nim.
nim:
  enabled: true
  namespace: rhoai-nim-models   # rhoai-nim uses this name too: keep both in sync
  displayName: RHOAI - NIM
  description: Models served with the NVIDIA NIM platform of OpenShift AI

# Training with Kubeflow Trainer v2 (TrainJob): enables the trainer component and creates the rhoai-training project,
# a Kueue namespace; its LocalQueues come from distributedWorkloads.localQueueNamespaces. The jobs are not part of the chart.
training:
  enabled: true

# Models-as-a-Service: aigateway.modelsAsAService plus the maas-default-gateway GatewayClass
modelsAsService:
  enabled: true
  namespace: models-as-a-service
  # Secret with the certificate that the public listener of maas-default-gateway presents (the Route is passthrough). The default
  # certificate of the router: spec.defaultCertificate of the default IngressController, or router-certs-default when it has none.
  # It must be in openshift-ingress.
  tlsSecret: ingress-certs
  # true: its own PostgreSQL (rhoai-maas-db) for the MaaS API; false: provide the maas-db-config secret yourself
  postgresql:
    enabled: true
    password: SecurePassword123  # Change for production
    storageSize: 20Gi
  # Demo content (templates/11-maas/5-demo): the simulator model with its two subscriptions. It is the only model that this repo
  # creates: the access to every other model (MaaSSubscription and MaaSAuthPolicy) is generated in rhoai-serving
  # (maas/1-subscriptions.sh, docs/011-maas.md). Turn the demo off to start without any model
  demo:
    enabled: true

  # Namespace of the second MaaS tenant (Technology Preview in RHOAI 3.5), the one that authenticates against Keycloak. It is
  # ai-tenant-<tenantName>, the name the MaaS controller gives an AITenant, created here (like models-as-a-service for the default
  # tenant) together with its Kueue LocalQueues and the DRA claim templates. The models of the tenant run in it. The tenant itself
  # (Gateway, Route, AITenant) is the maas-keycloak-chart, deployed by its own Argo CD Application so that it cannot
  # block or degrade this one. tenantName must be the same in both charts.
  keycloak:
    enabled: false
    tenantName: maas-keycloak
    # Simulator with its two subscriptions in the tenant (templates/11-maas/7-keycloak-demo), like demo for the default tenant
    demo:
      enabled: true

# Dynamic Resource Allocation (templates/06-dra). Needs the DRA flavor of rhoai-dependencies/operator-nvidia-gpu (GPUCluster).
# The pods request a GPU through a ResourceClaimTemplate instead of the nvidia.com/gpu limit (the models come from rhoai-serving).
# The GPU t-shirt sizes (gpu-s-x1, gpu-m-x1, gpu-l-x1, gpu-xl-x1, gpu-xl-x2) are one file each in templates/06-dra.
dra:
  enabled: true
  # Namespaces that get the templates. Default: modelsAsService.namespace, where the models run
  namespaces: []

# Grafana dashboards of llm-d and MaaS (they need the Grafana addon, INSTALL_GRAFANA in auto-install.sh)
grafana:
  enabled: true

llm_d:
  enabled: true
  # Direct llm-d gateway: GatewayClass + ConfigMap service override + Gateway (ClusterIP via
  # infrastructure.parametersRef) + Route (reencrypt, as the gateway of OpenShift AI itself).
  ocpRouteGateway:
    enabled: true

# https://access.redhat.com/articles/7136121
mlflow:
  enabled: true
  # Artifacts go to an S3 bucket (the one S4 serves, created by auto-install.sh); false keeps them on the PVC
  artifacts:
    s3:
      enabled: true
      bucket: mlflow
      endpoint: http://s4.s4.svc.cluster.local:7480
      region: us-east-1
      accessKey: s4admin
      secretKey: s4secret

trustyai:
  enabled: true

evalHub:
  enabled: true
  namespace: rhoai-evalhub  # the 3.4.0 dashboard only found EvalHub in redhat-ods-applications; go back there if it does not show up
  # true: its own PostgreSQL (rhoai-evalhub-db), which keeps the jobs across restarts; false: in-memory SQLite
  postgresql:
    enabled: true
    password: SecurePassword123  # Change for production
    storageSize: 10Gi

# Feast: each enabled example creates a FeatureStore (see the README)
featureStore:
  enabled: true
  namespace: rhoai-feature-store
  examples:
    # Project generated by `feast init`. Other templates: minimal, milvus, ray_rag, pytorch_nlp, postgres, spark...
    - enabled: true
      name: sample
      materializeSchedule: "*/15 * * * *"
      feastProjectDir:
        init:
          template: local
      # persistence:  # for the commented pvc-feature-store-*.yaml templates
      #   online:
      #     size: 5Gi
      #   offline:
      #     size: 5Gi
      #   registry:
      #     size: 5Gi
    # Feature repository from Git; authz.enabled turns on Kubernetes RBAC
    - enabled: false
      name: banking
      authz:
        enabled: false
      materializeSchedule: "*/15 * * * *"
      feastProjectDir:
        git:
          url: https://github.com/alvarolop/banking-feature-store
          ref: rbac
          # featureRepoPath: feature_repo

metalLB:
  enabled: false
  addresses:
    - 192.168.1.100/32

# Default values for rhoai-installation-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  culling:
    enabled: true
  # DNS segment after apps. in route hostnames (e.g. ocp.sandbox3642.opentlc.com for *.apps.ocp.sandbox3642.opentlc.com).
  clusterDomain: "ocp.sandbox437.opentlc.com"

modelRegistry:
  enabled: true

distributedWorkloads:
  enabled: true
  # General-purpose queue (cpu-profile, workbenches). All the queues are defined in templates/06-kueue/.
  clusterQueueName: cluster-queue
  defaultLocalQueueName: default
  # Namespaces that get the LocalQueues (default, serving-lq, batch-lq). Each one must already exist and carry the label
  # kueue.openshift.io/managed=true (this chart sets it on models-as-a-service).
  localQueueNamespaces:
    - models-as-a-service
  # Quotas per flavor, sized for a test cluster with at most one GPU (g6.2xlarge) and three 15.5 CPU / 58 GiB workers.
  # Keep them at or below what is free after the platform pods. For MIG/H100 see README-MIG.md.
  quotas:
    # Untainted workers (cluster-queue)
    cpuFlavor:
      cpu: "20"
      memory: 100Gi
    # GPU pool: serving-cq owns it, batch-cq may borrow it
    gpuFlavor:
      gpu: "1"
      cpu: "6"
      memory: 24Gi
  # Topology Aware Scheduling (disabled): see templates/06-kueue/Topology-hostname.yaml.
  # topologyAwareScheduling: false

# OGX is the new name of Llama Stack
llamaStack:
  enabled: true

# MCP: the lifecycle operator plus the MCP Catalog and MCP Registry of the dashboard
mcp:
  enabled: true

# Models-as-a-Service: aigateway.modelsAsAService plus the maas-default-gateway GatewayClass
modelsAsService:
  enabled: true
  namespace: models-as-a-service
  # MaaS infrastructure namespace, where the maas-db-config secret must live
  infraNamespace: redhat-ai-gateway-infra
  grafana:
    enabled: true
  postgresql:
    enabled: true
    namespace: rhoai-maas-db
    name: postgresql
    image: registry.redhat.io/rhel9/postgresql-15:9.7
    connection:
      database: maas
      user: maas
      password: SecurePassword123  # Change for production
      storageSize: 20Gi
    service:
      port: 5432
      ssl: false
  # Demo content (templates/15-maas-demo): the simulator model and the sample subscriptions below. Turn it off to put your own on top
  demo:
    enabled: true
  # Each entry creates a MaaSSubscription and a MaaSAuthPolicy. priority picks the default subscription when a user matches
  # several (production 100, staging 50, development 0, sandbox -10).
  configs:
    - name: basic-models
      displayName: "Basic Models"
      description: "Basic subscription for demo models"
      priority: 50
      groups:
        - cluster-admins
      models:
        # # Simple string format (no rate limits)
        # - name: granite-3-3-2b-instruct
        #   tokenRateLimits:
        #     - limit: 100
        #       window: 1h
        # Limits count prompt and completion tokens; Open WebUI sends extra title/tags requests, so keep them generous
        - name: tinyllama-1b
          tokenRateLimits:
            - limit: 100000
              window: 1h

llm_d:
  enabled: true
  # Second inference stack: GatewayClass + ConfigMap service override + Gateway (ClusterIP via
  # infrastructure.parametersRef) + Route. Pattern matches llm-d-guide gateway templates.
  ocpRouteGateway:
    enabled: true
  # Internal-only inference stack: GatewayClass + ConfigMap service override + Gateway (ClusterIP)
  # without Route for internal Service-only access.
  internalOnly:
    enabled: false
  # Custom TLS certificate for external listeners (base64-encoded). Used by 08-llm-d Gateway when set.
  # MaaS (11-maas-rhcl) uses service-ca + Route reencrypt instead.
  tlsCrtB64: ""
  tlsKeyB64: ""
  # Grafana dashboards for llm-d monitoring
  grafana:
    enabled: true

# https://access.redhat.com/articles/7136121
mlflow:
  enabled: true
  # Artifacts go to an S3 bucket (the one S4 serves, created by auto-install.sh); false keeps them on the PVC
  artifacts:
    s3:
      enabled: true
      bucket: mlflow
      endpoint: http://s4.s4.svc.cluster.local:7480
      region: us-east-1
      accessKey: s4admin
      secretKey: s4secret

trustyai:
  enabled: true

evalHub:
  enabled: true
  namespace: rhoai-evalhub  # the 3.4.0 dashboard only found EvalHub in redhat-ods-applications; go back there if it does not show up
  # All the providers and collections that the operator ships
  providers:
    - lm-evaluation-harness
    - garak
    - garak-kfp
    - guidellm
    - lighteval
    - deepeval
    - inspect
    - ragas
    - ibm-clear
  collections:
    - safety-and-fairness-v1
    - standard-llm-evals-v1
    - leaderboard-v2
    - reasoning-v1
    - instruction-following-v1
    - coding-v1
    - long-context-v1
    - toxicity-and-ethical-principles
    - model-validation
  # true: this PostgreSQL, which keeps the jobs across restarts; false: in-memory SQLite
  postgresql:
    enabled: true
    namespace: rhoai-evalhub-db
    name: evalhub-postgresql
    image: registry.redhat.io/rhel9/postgresql-15:latest
    connection:
      database: evalhub
      user: evalhub
      password: SecurePassword123
      storageSize: 10Gi
    service:
      port: 5432

# Feast: each enabled example creates a FeatureStore (see the README)
featureStore:
  enabled: true
  namespace: rhoai-feature-store
  examples:
    # Project generated by `feast init`. Other templates: minimal, milvus, ray_rag, pytorch_nlp, postgres, spark...
    - enabled: true
      name: sample
      materializeSchedule: "*/15 * * * *"
      feastProjectDir:
        init:
          template: local
      # persistence:  # for the commented pvc-feature-store-*.yaml templates
      #   online:
      #     size: 5Gi
      #   offline:
      #     size: 5Gi
      #   registry:
      #     size: 5Gi
    # Feature repository from Git; authz.enabled turns on Kubernetes RBAC
    - enabled: false
      name: banking
      authz:
        enabled: false
      materializeSchedule: "*/15 * * * *"
      feastProjectDir:
        git:
          url: https://github.com/alvarolop/banking-feature-store
          ref: rbac
          # featureRepoPath: feature_repo

metalLB:
  enabled: false
  addresses:
    - 192.168.1.100/32

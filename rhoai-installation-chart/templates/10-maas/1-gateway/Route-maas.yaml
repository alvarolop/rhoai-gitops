{{- if and .Values.modelsAsService.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: models-as-a-service
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/name: maas-gateway
    app.kubernetes.io/part-of: models-as-a-service
    gateway.networking.k8s.io/gateway-name: maas-default-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Same as the Route that OpenShift AI creates for its own gateway: the router trusts the service CA of the backend
    router.openshift.io/service-ca-certificate: "true"
spec:
  host: maas.apps.{{ .Values.global.clusterDomain }}
  to:
    kind: Service
    name: maas-default-gateway-maas-default-gateway
    weight: 100
  port:
    targetPort: 443
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
{{- end }}

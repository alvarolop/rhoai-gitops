{{- if and .Values.mlflow.enabled .Values.mlflow.artifacts.s3.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-s3-credentials
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "2"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.mlflow.artifacts.s3.accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.mlflow.artifacts.s3.secretKey | quote }}
  AWS_DEFAULT_REGION: {{ .Values.mlflow.artifacts.s3.region | quote }}
  MLFLOW_S3_ENDPOINT_URL: {{ .Values.mlflow.artifacts.s3.endpoint | quote }}
{{- end }}

{{ if and .Values.llm_d.enabled .Values.llm_d.ocpRouteGateway.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: openshift-ai-inference
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: openshift-ai-inference
  # Use ConfigMap to inject Service CA annotation for automatic TLS certificate generation
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: openshift-ai-inference-service-override
  listeners:
    # One listener without hostname, like the gateway of OpenShift AI itself. The router (reencrypt Route) connects with
    # the SNI of the Service, and a listener bound to a hostname resets any other SNI (HTTP 503 at the Route). The
    # certificate comes from the service CA and also covers the in-cluster name (Nemo Guardrails, etc.).
    - name: https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: rhoai-serving/model
                operator: Exists
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: openshift-ai-inference-internal-certs
        mode: Terminate
{{ end }}

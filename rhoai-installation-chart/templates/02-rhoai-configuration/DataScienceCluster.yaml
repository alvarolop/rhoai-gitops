---
apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: datasciencecluster
    app.kubernetes.io/part-of: rhods-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: rhods-operator
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  components:
    dashboard:
      managementState: Managed
    aipipelines:
      argoWorkflowsControllers:
        managementState: Managed
      managementState: Managed
    feastoperator:
      managementState: {{ if .Values.featureStore.enabled }}Managed{{ else }}Removed{{ end }}
    # Models-as-a-Service (MaaS) lives in the AI Gateway component since RHOAI 3.5. It no longer needs KServe.
    aigateway:
      managementState: {{ if .Values.modelsAsService.enabled }}Managed{{ else }}Removed{{ end }}
      modelsAsAService:
        managementState: {{ if .Values.modelsAsService.enabled }}Managed{{ else }}Removed{{ end }}
    kserve:
      managementState: Managed
      # Deprecated since 3.5 (kept through 3.6) in favor of aigateway.modelsAsAService. Removed -> Managed is blocked.
      modelsAsService:
        managementState: Removed
      nim:
        managementState: Managed
      rawDeploymentServiceConfig: Headless
    kueue:
      defaultClusterQueueName: {{ .Values.distributedWorkloads.clusterQueueName }}
      defaultLocalQueueName: {{ .Values.distributedWorkloads.defaultLocalQueueName }}
      managementState: {{ if .Values.distributedWorkloads.enabled }}Unmanaged{{ else }}Removed{{ end }}
    # Llama Stack was renamed to OGX in RHOAI 3.5. llamastackoperator is deprecated and kept Removed so only OGX runs.
    ogx:
      managementState: {{ if .Values.llamaStack.enabled }}Managed{{ else }}Removed{{ end }}
    llamastackoperator:
      managementState: Removed
    modelregistry:
      managementState: {{ if .Values.modelRegistry.enabled }}Managed{{ else }}Removed{{ end }}
      registriesNamespace: rhoai-model-registries
    mlflowoperator:
      managementState: {{ if .Values.mlflow.enabled }}Managed{{ else }}Removed{{ end }}
    ray:
      managementState: Managed
    workbenches:
      workbenchNamespace: rhods-notebooks
      managementState: Managed
    # Kubeflow Training Operator to tune models
    trainingoperator:
      managementState: Managed
    trustyai:
      managementState: {{ if .Values.trustyai.enabled }}Managed{{ else }}Removed{{ end }}

---
apiVersion: opendatahub.io/v1alpha
kind: OdhDashboardConfig
metadata:
  labels:
    app: rhods-dashboard
    app.kubernetes.io/part-of: rhods-dashboard
    app.opendatahub.io/rhods-dashboard: 'true'
    platform.opendatahub.io/part-of: dashboard
  name: odh-dashboard-config
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  dashboardConfig:
    # Core functionality options
    disableAdminConnectionTypes: false
    disableBYONImageStream: false
    disableClusterManager: false
    disableCustomServingRuntimes: false
    disableFeatureStore: {{ not .Values.featureStore.enabled }}
    disableLLMd: {{ not .Values.llm_d.enabled }}
    disableDistributedWorkloads: {{ not .Values.distributedWorkloads.enabled }}
    disableHome: false
    disableInfo: false
    disableISVBadges: false
    disableKServe: false
    disableKServeAuth: false
    disableKServeMetrics: false
    disableKServeRaw: false
    disableKueue: false  # Technology Preview - Kueue-enabled hardware profiles
    disableLMEval: false  # Technology Preview - Model evaluation runs
    disableModelCatalog: false  # Technology Preview - Model catalog menu
    disableModelRegistry: {{ not .Values.modelRegistry.enabled }}  # Technology Preview - Model registry menu
    disableModelRegistrySecureDB: false  # Technology Preview - CA certificate section
    disableModelServing: false
    disableNIMModelServing: false
    disablePerformanceMetrics: false
    disablePipelines: false
    disableProjectScoped: false
    disableProjectSharing: false
    disableProjects: false
    disableServingRuntimeParams: false
    disableStorageClasses: false
    disableSupport: false
    disableTracking: true
    disableTrustyBiasMetrics: false
    disableUserManagement: false
    enablement: true
    genAiStudio: true ## 👈👈 Enabled by us
    modelAsService: {{ .Values.modelsAsService.enabled }}  ## 👈👈 Enabled by us
    observabilityDashboard: {{ .Values.modelsAsService.enabled }}
    llmGatewayField: true
    # vLLM Deployment on MaaS
    vLLMDeploymentOnMaaS: {{ .Values.modelsAsService.enabled }}
    # Generally available (already on by default, pinned explicitly)
    projectRBAC: true
    roleManagement: true
    trainingJobs: true
    gpuaas: true
    # Technology Preview (RHOAI 3.5 default: false). Enabled to enrich the UI.
    automl: true
    autorag: true
    connectionTest: true  # Verify connection credentials (e.g. S4) before saving
    deploymentWizardYAMLViewer: true
    externalModels: {{ .Values.modelsAsService.enabled }}
    featureStoreAdmin: {{ .Values.featureStore.enabled }}
    genAiTracing: true
    guardrails: {{ .Values.trustyai.enabled }}
    llmdTemplates: {{ .Values.llm_d.enabled }}
    mcpCatalog: {{ .Values.agentic.enabled }}
    promptManagement: {{ .Values.mlflow.enabled }}  # Loads prompts from the MLflow prompt registry
    toolCalling: true
    # Agentic AI (Developer Preview, except custom endpoints which are Technology Preview): see agentic in values.yaml
    agentConfigManagement: {{ .Values.agentic.enabled }}  # Save playground configurations as named agents
    agentOps: {{ .Values.agentic.enabled }}  # Agent Ops in Gen AI Studio
    agentsCatalog: {{ .Values.agentic.enabled }}  # Agents Catalog page (AI hub -> Agents)
    aiAssetCustomEndpoints: {{ .Values.agentic.enabled }}  # Custom endpoints for AI assets
    # New in 3.5, disabled until needed
    externalVectorStores: false  # External vector stores for RAG
    globalProjectPrompts: false  # Global project setting for prompts in cluster settings
    mcpRegistry: {{ .Values.agentic.enabled }}  # MCP Registry tab in the MCP Servers page
  # Other spec fields (3.5), unset by default:
  modelServing:
    deploymentStrategy: recreate  # rolling | recreate. Recreate avoids a second replica waiting for a GPU during updates
    isLLMdDefault: {{ .Values.llm_d.enabled }}  # pre-select llm-d in the deployment wizard
  # genAiStudioConfig:
  #   aiAssetCustomEndpoints: false
  # hardwareProfileOrder: [cpu-profile, gpu-profile, gpu-batch-profile]
  # globalMLflowNamespaces: []  # a single namespace
  groupsConfig:
    adminGroups: rhods-admins
    allowedGroups: system:authenticated
  modelServerSizes:
  - name: Small
    resources:
      limits:
        cpu: "2"
        memory: 8Gi
      requests:
        cpu: "1"
        memory: 4Gi
  - name: Medium
    resources:
      limits:
        cpu: "8"
        memory: 10Gi
      requests:
        cpu: "4"
        memory: 8Gi
  - name: Large
    resources:
      limits:
        cpu: "10"
        memory: 20Gi
      requests:
        cpu: "6"
        memory: 16Gi
  notebookController:
    enabled: true
    notebookNamespace: rhods-notebooks
    pvcSize: 20Gi
  notebookSizes:
  - name: Small
    resources:
      limits:
        cpu: "2"
        memory: 8Gi
      requests:
        cpu: "1"
        memory: 8Gi
  - name: Medium
    resources:
      limits:
        cpu: "6"
        memory: 24Gi
      requests:
        cpu: "3"
        memory: 24Gi
  - name: Large
    resources:
      limits:
        cpu: "14"
        memory: 56Gi
      requests:
        cpu: "7"
        memory: 56Gi
  - name: X Large
    resources:
      limits:
        cpu: "30"
        memory: 120Gi
      requests:
        cpu: "15"
        memory: 120Gi
  templateDisablement: []
  templateOrder: []

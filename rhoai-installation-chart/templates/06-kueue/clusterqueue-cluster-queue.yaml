{{- if .Values.distributedWorkloads.enabled }}
---
# General-purpose queue: workbenches and other CPU workloads on untainted workers. It is the default queue RHOAI
# uses for new projects (see defaultClusterQueueName in the DataScienceCluster).
#
# Workbenches cannot be suspended, so RHOAI only allows them in a NON-PREEMPTIVE queue. Preemption is therefore
# disabled explicitly (these are also the defaults). No cohort: it never lends or borrows.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: {{ .Values.distributedWorkloads.clusterQueueName }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  namespaceSelector: {} # match all.
  preemption:
    reclaimWithinCohort: Never
    withinClusterQueue: Never
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: "cpu-flavor"
          resources:
            - name: "cpu"
              nominalQuota: {{ .Values.distributedWorkloads.quotas.cpuFlavor.cpu | quote }}
            - name: "memory"
              nominalQuota: {{ .Values.distributedWorkloads.quotas.cpuFlavor.memory | quote }}
{{- end }}

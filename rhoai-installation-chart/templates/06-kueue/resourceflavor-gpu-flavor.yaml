{{- if .Values.distributedWorkloads.enabled }}
---
# NVIDIA GPU nodes: tolerate the GPU device plugin taint so workloads can schedule on GPU workers.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu-flavor
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Topology Aware Scheduling disabled - uncomment below if needed:
  # topologyName: rhoai-hostname
  # nodeLabels:
  #   nvidia.com/gpu.deploy.device-plugin: "true"
  tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
#
# ---------------------------------------------------------------------------
# Reference: NVIDIA H100 with MIG (mixed strategy). One ResourceFlavor per MIG profile. Not rendered: remove the leading "# " to use it.
# Also add the MIG resources to serving-cq and batch-cq (see the commented blocks at the end of those files).
# See README-MIG.md.
# ---------------------------------------------------------------------------
# ---
# # MIG 1g.12gb nodes: tolerate MIG taints for small GPU slices
# # Small instance with ~12GB memory, ideal for inference workloads
# apiVersion: kueue.x-k8s.io/v1beta2
# kind: ResourceFlavor
# metadata:
#   name: mig-1g-12gb
#   annotations:
#     argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
#     argocd.argoproj.io/sync-wave: "1"
# spec:
#   tolerations:

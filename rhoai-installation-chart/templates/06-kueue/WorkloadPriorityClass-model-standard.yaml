{{- if .Values.distributedWorkloads.enabled }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: model-standard
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

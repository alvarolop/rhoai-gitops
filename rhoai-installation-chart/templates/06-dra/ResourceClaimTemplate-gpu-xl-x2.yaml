{{- if .Values.dra.enabled }}
{{- range (concat (.Values.dra.namespaces | default (list (.Values.modelsAsService.namespace | default "models-as-a-service"))) (include "rhoai-installation-chart.keycloakModelsNamespaces" . | fromJsonArray)) }}
---
# Extra large, 2 GPUs: Llama 70B in BF16 (about 130 Gi of weights) split with tensor parallelism.
# 2 whole GPUs of 78 Gi or more (an H100 80GB reports 79.6 Gi, so 80Gi would leave it out):
# 2 x H100 80GB = 159 Gi (tight, short context), 2 x H100 94GB = 188 Gi, 2 x H200 = 282 Gi, 2 x B200 = 360 Gi.
# The model needs parallelism.tensor: 2.
# No MIG alternative: MIG partitions of a GPU cannot be combined with tensor parallelism between them.
#   L4 only cluster -> does not schedule.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-xl-x2
  namespace: {{ . }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  spec:
    devices:
      requests:
        - name: gpu
          firstAvailable:
            - name: gpu-x2-min-78gi
              deviceClassName: gpu.nvidia.com
              allocationMode: ExactCount
              count: 2
              selectors:
                - cel:
                    expression: device.capacity['gpu.nvidia.com'].memory.compareTo(quantity("78Gi")) >= 0
{{- end }}
{{- end }}

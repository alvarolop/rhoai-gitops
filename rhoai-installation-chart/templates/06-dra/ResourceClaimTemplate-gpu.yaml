{{- if .Values.dra.enabled }}
{{- range (.Values.dra.namespaces | default (list (.Values.modelsAsService.namespace | default "models-as-a-service"))) }}
---
# One full GPU of the product in dra.gpu.productName. The pods that reference it get their own claim.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: {{ $.Values.dra.gpu.templateName }}
  namespace: {{ . }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
            selectors:
              - cel:
                  expression: device.attributes['gpu.nvidia.com'].productName == {{ $.Values.dra.gpu.productName | quote }}
{{- end }}
{{- end }}

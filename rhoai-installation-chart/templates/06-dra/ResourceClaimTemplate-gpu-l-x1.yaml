{{- if .Values.dra.enabled }}
{{- range (concat (.Values.dra.namespaces | default (list (.Values.modelsAsService.namespace | default "models-as-a-service"))) (include "rhoai-installation-chart.keycloakModelsNamespaces" . | fromJsonArray) (include "rhoai-installation-chart.nimModelsNamespaces" . | fromJsonArray)) }}
---
# Large: 1 whole H100 (80 GB or more; it reports 79.6 Gi, hence the 78Gi threshold). Alternatives in order, the first one that fits wins.
#   H100 -> the full GPU;  H100 94GB in MIG mode -> 7g.94gb (the whole card as one partition).
#   L4 only cluster -> does not schedule (there is no GPU of 80 Gi).
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-l-x1
  namespace: {{ . }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  spec:
    devices:
      requests:
        - name: gpu
          firstAvailable:
            - name: gpu-min-78gi
              deviceClassName: gpu.nvidia.com
              allocationMode: ExactCount
              count: 1
              selectors:
                - cel:
                    expression: device.capacity['gpu.nvidia.com'].memory.compareTo(quantity("78Gi")) >= 0
            - name: mig-7g-94gb
              deviceClassName: mig.nvidia.com
              allocationMode: ExactCount
              count: 1
              selectors:
                - cel:
                    expression: device.attributes['gpu.nvidia.com'].profile == "7g.94gb"
{{- end }}
{{- end }}

{{- if .Values.dra.enabled }}
{{- range (concat (.Values.dra.namespaces | default (list (.Values.modelsAsService.namespace | default "models-as-a-service"))) (include "rhoai-installation-chart.keycloakModelsNamespaces" . | fromJsonArray) (include "rhoai-installation-chart.nimModelsNamespaces" . | fromJsonArray)) }}
---
# Large: 1 whole GPU of 78 Gi or more (an H100 80GB reports 79.6 Gi, hence 78Gi).
#   L4 only cluster -> does not schedule (there is no GPU of 78 Gi).
# Force=true,Replace=true: the spec of a ResourceClaimTemplate is immutable, so Argo CD recreates it when it changes (running pods keep their claims).
# One exact request with a CEL selector, not firstAvailable: Kueue cannot admit a workload whose claim uses firstAvailable
# ("FirstAvailable device selection is not supported"), so every GPU pod would stay SchedulingGated. The price is no MIG
# fallback: the alternatives are in the commented reference at the end of the file.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-l-x1
  namespace: {{ . }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Force=true,Replace=true
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
            allocationMode: ExactCount
            count: 1
            selectors:
              - cel:
                  expression: device.capacity['gpu.nvidia.com'].memory.compareTo(quantity("78Gi")) >= 0
{{- end }}
{{- end }}

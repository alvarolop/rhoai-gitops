{{ if .Values.mlflow.enabled }}
---
apiVersion: mlflow.opendatahub.io/v1
kind: MLflow
metadata:
  name: mlflow
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
spec:
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
  backendStoreUri: "sqlite:////mlflow/mlflow.db"
{{- if .Values.mlflow.artifacts.s3.enabled }}
  artifactsDestination: "s3://{{ .Values.mlflow.artifacts.s3.bucket }}/artifacts"
  envFrom:
    - secretRef:
        name: mlflow-s3-credentials
  # The operator's NetworkPolicy only lets MLflow reach S3 on 9000, 8333 and 8334; S4 listens on another port
  networkPolicyAdditionalEgressRules:
    - ports:
        - protocol: TCP
          port: {{ index (splitList ":" (urlParse .Values.mlflow.artifacts.s3.endpoint).host) 1 }}
{{- else }}
  artifactsDestination: "file:///mlflow/artifacts"
{{- end }}
  serveArtifacts: true
  # Permanently deletes runs, experiments and models that were already deleted from the UI or API
  # garbageCollection:
  #   schedule: "0 3 * * *"
  #   olderThan: 7d
  # Moves old trace payloads to an artifact location (S3, or file:// only with RWX storage)
  # traceArchival:
  #   enabled: true
  #   schedule: "0 */6 * * *"
  #   location: s3://mlflow-trace-archive
  #   retention: 30d
{{- end }}

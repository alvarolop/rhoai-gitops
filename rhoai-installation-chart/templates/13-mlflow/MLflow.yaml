{{ if .Values.mlflow.enabled }}
---
apiVersion: mlflow.opendatahub.io/v1
kind: MLflow
metadata:
  name: mlflow
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
spec:
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
  backendStoreUri: "sqlite:////mlflow/mlflow.db"
  artifactsDestination: "file:///mlflow/artifacts"
  serveArtifacts: true
  # Permanently deletes runs, experiments and models that were already deleted from the UI or API
  # garbageCollection:
  #   schedule: "0 3 * * *"
  #   olderThan: 7d
  # Moves old trace payloads to an artifact location (S3, or file:// only with RWX storage)
  # traceArchival:
  #   enabled: true
  #   schedule: "0 */6 * * *"
  #   location: s3://mlflow-trace-archive
  #   retention: 30d
{{- end }}

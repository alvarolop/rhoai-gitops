{{- if and .Values.evalHub.enabled .Values.evalHub.postgresql.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evalhub-postgresql
  namespace: rhoai-evalhub-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evalhub-postgresql
  template:
    metadata:
      labels:
        app: evalhub-postgresql
    spec:
      containers:
        - name: evalhub-postgresql
          image: registry.redhat.io/rhel9/postgresql-15:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: evalhub-postgresql-credentials
                  key: POSTGRES_DB
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: evalhub-postgresql-credentials
                  key: POSTGRES_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: evalhub-postgresql-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: evalhub-postgresql-data
{{- end }}

{{- if .Values.distributedWorkloads.enabled }}
---
# The GPU pool of the cluster, as the quota of the cohort. serving-cq and batch-cq (nominalQuota 0) borrow from it, and
# priority decides who keeps it (preemption of serving-cq). Static: Kueue does not read the capacity of the nodes.
#
# NOTE: the quota is deliberately above the real hardware: it is sized as 3 GPU nodes (3x g6.2xlarge: 3 GPUs, 21 vCPU,
# 84 Gi) while the cluster has 1, so it does not have to be edited when a node is added. Trade-off: while the quota is
# not used up, Kueue admits a model even if the real GPU is taken, and does not preempt batch: the model pod stays
# Pending until the job ends. Preemption only works when the quota matches the real GPUs: set it to them for that.
apiVersion: kueue.x-k8s.io/v1beta2
kind: Cohort
metadata:
  name: gpu-cluster
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: "gpu-flavor"
          resources:
            - name: "cpu"
              nominalQuota: "21"
            - name: "memory"
              nominalQuota: "84Gi"
            - name: "nvidia.com/gpu"
              nominalQuota: "3"
{{- end }}

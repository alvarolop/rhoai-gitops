{{- if .Values.distributedWorkloads.enabled }}
---
# Shared pool (see Cohort-gpu-cluster.yaml): the GPUs, CPU and memory of the cluster are the quota of the cohort, and
# serving-cq owns none of it (nominalQuota 0, no borrowingLimit): it borrows what it needs. Priority decides between
# queues: a model (model-critical / model-standard) that does not fit preempts the batch workloads of batch-cq,
# whose priority is lower, and never one of its own kind. The preempted job is evicted and requeued, not failed.
#
# Used by model serving (gpu-profile -> LocalQueue serving-lq). Every project that needs it must have that LocalQueue.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: serving-cq
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  cohortName: gpu-cluster
  namespaceSelector: {} # match all.
  # Priority is absolute for serving: a model-critical replica is never overtaken by a lower-priority one.
  queueingStrategy: StrictFIFO
  preemption:
    # Nominal quota is 0, so every model borrows: borrowWithinCohort is the one that applies. Only workloads up to
    # maxPriorityThreshold can be preempted this way (batch-interactive 1000 and batch-nightly 100, never a model).
    reclaimWithinCohort: LowerPriority
    borrowWithinCohort:
      policy: LowerPriority
      maxPriorityThreshold: 10000
    withinClusterQueue: LowerPriority
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: "gpu-flavor"
          resources:
            - name: "cpu"
              nominalQuota: "0"
            - name: "memory"
              nominalQuota: "0"
            - name: "nvidia.com/gpu"
              nominalQuota: "0"
#
# ---------------------------------------------------------------------------
# Reference: NVIDIA H100 with MIG (mixed strategy). Replacement resourceGroups. Not rendered: remove the leading "# " to use it.
# Replace the resourceGroups block above with this one and add the MIG ResourceFlavors (ResourceFlavor-gpu-flavor.yaml).
# A resource name can only be covered by ONE resourceGroup, so keep a single group, add the MIG resources to
# coveredResources and one flavor per MIG profile. Every flavor lists ALL covered resources in the same order,
# with 0 for the ones it does not provide. Quotas are examples for 2 H100 GPUs: adjust them to your cluster.
# See docs/gpu-mig.md.

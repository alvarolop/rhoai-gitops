{{- if .Values.distributedWorkloads.enabled }}
{{- range (concat .Values.distributedWorkloads.localQueueNamespaces (include "rhoai-installation-chart.keycloakModelsNamespaces" . | fromJsonArray)) }}
---
# LocalQueues are the namespaced handle that HardwareProfiles (and the kueue.x-k8s.io/queue-name label) point to.
# LocalQueue of the general-purpose default-cq. HardwareProfile cpu-profile points to it and it is the queue Kueue's
# webhook assigns by default.
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: default
  namespace: {{ . }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterQueue: default-cq
{{- end }}
{{- end }}

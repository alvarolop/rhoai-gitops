{{- if .Values.modelRegistry.enabled }}
---
apiVersion: modelregistry.opendatahub.io/v1beta1
kind: ModelRegistry
metadata:
  annotations:
    openshift.io/description: Local registry for models
    openshift.io/display-name: Local Registry
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
  name: local
  namespace: rhoai-model-registries
spec:
  rest:
    port: 8080
    serviceRoute: disabled
  # kube-rbac-proxy (default) publishes the registry in the route local-https; callers authenticate with an OpenShift token.
  kubeRBACProxy:
    serviceRoute: enabled
  # "Default database" of the dashboard: the operator deploys and manages a PostgreSQL next to the registry.
  # Evaluation and demos only, Red Hat does not support it in production. For production point to an external
  # PostgreSQL (16.x) or MySQL instead: postgres.host/port/database/username/passwordSecret (or the mysql block).
  postgres:
    generateDeployment: true
{{- end }}

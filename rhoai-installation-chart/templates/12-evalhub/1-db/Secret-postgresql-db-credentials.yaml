{{- if and .Values.evalHub.enabled .Values.evalHub.postgresql.enabled }}
---
kind: Secret
apiVersion: v1
metadata:
  name: evalhub-postgresql-credentials
  namespace: rhoai-evalhub-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
stringData:
  POSTGRES_DB: "evalhub"
  POSTGRES_USER: "evalhub"
  POSTGRES_PASSWORD: {{ .Values.evalHub.postgresql.password | quote }}
type: Opaque
{{- end }}

{{- if and .Values.evalHub.enabled .Values.evalHub.postgresql.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: evalhub-postgresql
  namespace: rhoai-evalhub-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: evalhub-postgresql
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
{{- end }}

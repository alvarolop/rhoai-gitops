{{- if and .Values.evalHub.enabled .Values.evalHub.postgresql.enabled }}
{{- $pg := .Values.evalHub.postgresql }}
{{- $host := "evalhub-postgresql.rhoai-evalhub-db.svc.cluster.local" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: evalhub-db-credentials
  namespace: {{ .Values.evalHub.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  db-url: {{ printf "postgresql://evalhub:%s@%s:5432/evalhub" ($pg.password | urlquery) $host | quote }}
{{- end }}

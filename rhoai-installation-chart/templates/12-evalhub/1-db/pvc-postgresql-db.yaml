{{- if and .Values.evalHub.enabled .Values.evalHub.postgresql.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evalhub-postgresql-data
  namespace: rhoai-evalhub-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.evalHub.postgresql.storageSize }}
{{- end }}

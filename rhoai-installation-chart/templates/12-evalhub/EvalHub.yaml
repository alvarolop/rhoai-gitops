{{- if .Values.evalHub.enabled }}
---
apiVersion: trustyai.opendatahub.io/v1
kind: EvalHub
metadata:
  name: evalhub
  namespace: {{ .Values.evalHub.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  replicas: 1
  database:
{{- if .Values.evalHub.postgresql.enabled }}
    type: postgresql
    secret: evalhub-db-credentials
{{- else }}
    type: sqlite  # in memory: lost when the pod restarts
{{- end }}
  providers:
  {{- range .Values.evalHub.providers }}
    - {{ . }}
  {{- end }}
  collections:
  {{- range .Values.evalHub.collections }}
    - {{ . }}
  {{- end }}
  # otel:
  #   exporterEndpoint: data-science-collector.redhat-ods-monitoring.svc:4317
  #   exporterInsecure: true
  env:
    - name: MLFLOW_TRACKING_URI
      value: "https://mlflow.redhat-ods-applications.svc:8443/mlflow"
{{- end }}

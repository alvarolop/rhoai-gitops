{{- if .Values.evalHub.enabled }}
---
apiVersion: trustyai.opendatahub.io/v1
kind: EvalHub
metadata:
  name: evalhub
  namespace: {{ .Values.evalHub.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  replicas: 1
  database:
{{- if .Values.evalHub.postgresql.enabled }}
    type: postgresql
    secret: evalhub-db-credentials
{{- else }}
    type: sqlite  # in memory: lost when the pod restarts
{{- end }}
  # All the providers and collections that the operator ships
  providers:
    - lm-evaluation-harness
    - garak
    - garak-kfp
    - guidellm
    - lighteval
    - deepeval
    - inspect
    - ragas
    - ibm-clear
  collections:
    - safety-and-fairness-v1
    - standard-llm-evals-v1
    - leaderboard-v2
    - reasoning-v1
    - instruction-following-v1
    - coding-v1
    - long-context-v1
    - toxicity-and-ethical-principles
    - model-validation
  # otel:
  #   exporterEndpoint: data-science-collector.redhat-ods-monitoring.svc:4317
  #   exporterInsecure: true
  env:
    - name: MLFLOW_TRACKING_URI
      value: "https://mlflow.redhat-ods-applications.svc:8443/mlflow"
{{- end }}

{{- $g := .Values.modelsAsService.demo.gemma }}
{{- if and .Values.modelsAsService.enabled .Values.modelsAsService.demo.enabled $g.enabled }}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: {{ $g.name }}
  namespace: {{ .Values.modelsAsService.namespace | default "models-as-a-service" }}
  annotations:
    openshift.io/display-name: "Gemma 4 12B (FP8)"
    openshift.io/description: "A real 12B model on one GPU, claimed through DRA when dra.enabled is true"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "10"
spec:
  modelRef:
    kind: LLMInferenceService
    name: {{ $g.name }}
{{- end }}

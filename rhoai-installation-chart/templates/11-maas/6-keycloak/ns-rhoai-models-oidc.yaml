{{- if and .Values.modelsAsService.enabled .Values.modelsAsService.keycloak.enabled }}
{{- $t := .Values.modelsAsService.keycloak }}
---
# Namespace for the models of the Keycloak tenant, apart from models-as-a-service (the default tenant keeps its own).
# The labels are the ones of a model namespace (dashboard project, rhoai-serving model, Kueue). Its LocalQueues and DRA claim
# templates are created by 04-kueue and 06-dra through the helper keycloakModelsNamespaces. The tenant itself (Gateway, Route,
# AITenant, subscriptions) is NOT in this chart: it is the maas-keycloak-chart, with its own Application.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $t.modelsNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    openshift.io/display-name: RHOAI - MaaS OIDC models
    openshift.io/description: Models of the MaaS tenant {{ $t.tenantName }}, whose users sign in with Keycloak
  labels:
    opendatahub.io/dashboard: 'true'
    rhoai-serving/model: 'true'
    kueue.openshift.io/managed: 'true'
{{- end }}

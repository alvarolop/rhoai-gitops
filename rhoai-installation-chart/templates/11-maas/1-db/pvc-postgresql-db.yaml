{{- if and .Values.modelsAsService.enabled .Values.modelsAsService.postgresql.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  namespace: rhoai-maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.modelsAsService.postgresql.storageSize }}
{{- end }}

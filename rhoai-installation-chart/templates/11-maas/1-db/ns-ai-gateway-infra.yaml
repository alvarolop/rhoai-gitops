{{- if and .Values.modelsAsService.enabled .Values.modelsAsService.postgresql.enabled }}
# The AI Gateway operator creates this namespace when MaaS is enabled, but the maas-db-config secret has to exist
# in it and Argo CD applies the secret before the operator runs, so create it first. The operator adds its own labels.
apiVersion: v1
kind: Namespace
metadata:
  name: redhat-ai-gateway-infra
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  {{- if .Values.modelsAsService.keycloak.enabled }}
  labels:
    # Lets the HTTPRoute of the maas-api of the Keycloak tenant attach to its gateway (6-keycloak)
    maas.opendatahub.io/gateway-access-{{ .Values.modelsAsService.keycloak.tenantName }}: "true"
  {{- end }}
{{- end }}

{{- if and .Values.modelsAsService.enabled .Values.modelsAsService.postgresql.enabled }}
---
kind: Secret
apiVersion: v1
metadata:
  name: postgresql-credentials
  namespace: rhoai-maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
stringData:
  POSTGRES_DB: "maas"
  POSTGRES_USER: "maas"
  POSTGRES_PASSWORD: {{ .Values.modelsAsService.postgresql.password | quote }}
type: Opaque
{{- end }}

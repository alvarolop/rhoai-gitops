{{- if and .Values.modelsAsService.enabled .Values.modelsAsService.postgresql.enabled }}
{{- $pg := .Values.modelsAsService.postgresql }}
{{- $host := "postgresql.rhoai-maas-db.svc.cluster.local" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: maas-db-config
  namespace: redhat-ai-gateway-infra
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  DB_CONNECTION_URL: {{ printf "postgresql://maas:%s@%s:5432/maas?sslmode=disable" ($pg.password | urlquery) $host | quote }}
{{- end }}

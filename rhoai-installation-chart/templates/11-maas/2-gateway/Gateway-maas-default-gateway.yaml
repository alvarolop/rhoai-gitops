{{- if and .Values.modelsAsService.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  labels:
    kuadrant.io/gateway: "true"
    app.kubernetes.io/name: maas-gateway
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
    opendatahub.io/managed: "false"
    security.opendatahub.io/authorino-tls-bootstrap: "true"
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: maas-default-gateway
  # The ConfigMap makes the service CA issue the certificate of the listener
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: maas-service-override
  listeners:
    # Public listener, as in the RHOAI 3.5 docs: it has the hostname of the Route (maas-api reads it in /v1/tenants) and the
    # certificate of the router (Let's Encrypt wildcard). The Route is passthrough, so the clients get this certificate.
    - name: https
      hostname: maas.apps.{{ .Values.global.clusterDomain }}
      port: 443
      protocol: HTTPS
      allowedRoutes: &allowedRoutes
        namespaces:
          from: All
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.modelsAsService.tlsSecret }}
        mode: Terminate
    # Internal listener, without hostname: the in-cluster address that the models publish in their status
    # (https://maas-default-gateway-maas-default-gateway.openshift-ingress.svc.cluster.local) keeps working with the
    # certificate of the service CA that the ConfigMap above makes the service CA issue.
    - name: https-internal
      port: 443
      protocol: HTTPS
      allowedRoutes: *allowedRoutes
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: maas-default-gateway-internal-certs
        mode: Terminate
{{- end }}

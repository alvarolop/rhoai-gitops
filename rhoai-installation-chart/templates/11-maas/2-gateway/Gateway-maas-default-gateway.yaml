{{- if and .Values.modelsAsService.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  labels:
    kuadrant.io/gateway: "true"
    app.kubernetes.io/name: maas-gateway
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
    opendatahub.io/managed: "false"
    security.opendatahub.io/authorino-tls-bootstrap: "true"
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: maas-default-gateway
  # The ConfigMap makes the service CA issue the certificate of the listener
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: maas-service-override
  listeners:
    - name: https
      # No hostname: the router (reencrypt Route) connects with the SNI of the Service, and a listener bound to a
      # hostname resets any other SNI (HTTP 503 at the Route)
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: maas-default-gateway-internal-certs
        mode: Terminate
{{- end }}

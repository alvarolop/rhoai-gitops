{{- if or .Values.modelsAsService.enabled .Values.llm_d.ocpRouteGateway.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: restart-kuadrant
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: restart-kuadrant
subjects:
  - kind: ServiceAccount
    name: restart-kuadrant
    namespace: openshift-gitops
{{- end }}

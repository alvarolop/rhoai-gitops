{{- if .Values.modelsAsService.enabled }}
---
# Injects the service CA annotation into the Service that the Gateway creates, so that the service CA issues the
# certificate of the internal listener (the in-cluster address of the gateway). The public listener presents the certificate of
# the router, and the Service is ClusterIP: the passthrough Route is the entry point.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-service-override
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  service: |
    metadata:
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: "maas-default-gateway-internal-certs"
    spec:
      type: ClusterIP
{{- end }}

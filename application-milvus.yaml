---
# Official Milvus chart: https://milvus.io/docs/install_cluster-helm.md (standalone mode)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app: milvus
  name: milvus
  namespace: openshift-gitops
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: milvus
  project: default
  sources:
    - repoURL: https://zilliztech.github.io/milvus-helm/
      chart: milvus
      # 5.0.25 is the last chart paired with Milvus 2.6 (appVersion 2.6.21). From 5.0.27 the chart ships Milvus 3.0,
      # whose images have /milvus/bin and /milvus/lib as milvus:milvus without access for "other", so the arbitrary
      # UID of the restricted-v2 SCC gets "exec milvus failed: Permission denied".
      targetRevision: 5.0.25
      helm:
        releaseName: vectordb
        values: |
          cluster:
            enabled: false
          # The chart enables Pulsar by default; standalone uses the embedded Woodpecker message queue
          pulsarv3:
            enabled: false

          standalone:
            persistence:
              persistentVolumeClaim:
                size: 20Gi

          # OpenShift: etcd and MinIO hardcode a UID and fsGroup that the restricted-v2 SCC rejects
          etcd:
            replicaCount: 1
            podSecurityContext:
              enabled: false
            containerSecurityContext:
              enabled: false
          minio:
            mode: standalone
            # Chart 5.0.25 points to minio/minio, which was removed from Docker Hub; 5.0.34 uses this mirror
            image:
              repository: milvusdb/minio
              tag: RELEASE.2024-12-18T13-15-44Z
            securityContext:
              enabled: false
            resources:
              requests:
                memory: 512Mi
            persistence:
              size: 20Gi

          attu:
            enabled: true
            route:
              enabled: true
              host: attu-milvus.apps.$CLUSTER_DOMAIN
    # ConsoleLink to Attu in the OpenShift application menu
    - repoURL: https://github.com/alvarolop/rhoai-gitops.git
      targetRevision: main
      path: addons/milvus
      helm:
        values: |
          clusterDomain: $CLUSTER_DOMAIN
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true

{{- $t := .Values }}
{{- $host := $t.host | default (printf "%s.apps.%s" $t.tenantName .Values.global.clusterDomain) }}
---
# Dedicated Gateway of the second MaaS tenant. Each AITenant needs its own Gateway; the default tenant keeps
# maas-default-gateway. Required annotations (RHOAI 3.5 multi-tenancy): opendatahub.io/managed "false" and
# security.opendatahub.io/authorino-tls-bootstrap "true".
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $t.tenantName }}
  namespace: openshift-ingress
  labels:
    kuadrant.io/gateway: "true"
    app.kubernetes.io/name: maas-gateway
    app.kubernetes.io/part-of: {{ $t.tenantName }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
    opendatahub.io/managed: "false"
    security.opendatahub.io/authorino-tls-bootstrap: "true"
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: {{ $t.gatewayClassName }}
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ $t.tenantName }}-service-override
  listeners:
    # Public listener, as in the RHOAI 3.5 docs: it has the hostname of the Route (maas-api reads it in /v1/tenants) and the
    # certificate of the router (Let's Encrypt wildcard). The Route is passthrough, so the clients get this certificate.
    - name: https
      hostname: {{ $host }}
      port: 443
      protocol: HTTPS
      allowedRoutes: &allowedRoutes
        # Only the maas-api namespace and the namespace of this tenant can attach routes ("from: All" would let any
        # namespace hijack the model paths, RHOAIENG-80360). The doc selects them with a label of its own
        # (maas.opendatahub.io/gateway-access-<tenant>); matching kubernetes.io/metadata.name, which every namespace already
        # has, gives the same result without touching any existing namespace.
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - {{ $t.infraNamespace }}
                  - ai-tenant-{{ $t.tenantName }}
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ $t.tlsSecret }}
        mode: Terminate
    # Internal listener, without hostname: the in-cluster address that the models publish in their status
    # (https://<gateway>.openshift-ingress.svc.cluster.local) keeps working with the certificate of the service CA.
    - name: https-internal
      port: 443
      protocol: HTTPS
      allowedRoutes: *allowedRoutes
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ $t.tenantName }}-internal-certs
        mode: Terminate

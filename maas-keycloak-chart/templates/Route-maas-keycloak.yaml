{{- $t := .Values }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $t.tenantName }}
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/name: maas-gateway
    app.kubernetes.io/part-of: {{ $t.tenantName }}
    gateway.networking.k8s.io/gateway-name: {{ $t.tenantName }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  host: {{ $t.host | default (printf "%s.apps.%s" $t.tenantName .Values.global.clusterDomain) }}
  to:
    kind: Service
    # <gateway>-<gatewayClass>, the name the Gateway controller gives the Service
    name: {{ $t.tenantName }}-{{ $t.gatewayClassName }}
    weight: 100
  port:
    targetPort: 443
  # Passthrough: the router forwards the TLS connection by SNI and the gateway listener presents the certificate of the router
  # (a reencrypt Route would connect with the SNI of the Service, which a listener with hostname resets: HTTP 503)
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect

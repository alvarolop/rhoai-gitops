{{- $t := .Values }}
{{- range $t.configs }}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: {{ .name }}-policy
  namespace: ai-tenant-{{ $t.tenantName }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "6"
spec:
  modelRefs:
  {{- range .models }}
    {{- if kindIs "string" . }}
    - name: {{ . }}
      namespace: {{ $t.modelsNamespace }}
    {{- else }}
    - name: {{ .name }}
      namespace: {{ .namespace | default $t.modelsNamespace }}
    {{- end }}
  {{- end }}
  subjects:
    groups:
    {{- range .groups }}
      - name: {{ . }}
    {{- end }}
{{- end }}

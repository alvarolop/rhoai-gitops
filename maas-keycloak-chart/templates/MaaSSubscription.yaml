{{- $t := .Values }}
{{- range $t.configs }}
---
# Created in the tenant namespace. The admission webhook rejects it until the controller has created the MaasTenantConfig
# of the tenant, so the first sync can need a retry.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: {{ .name }}
  namespace: ai-tenant-{{ $t.tenantName }}
  annotations:
    openshift.io/display-name: {{ .displayName | default .name | quote }}
    {{- if .description }}
    openshift.io/description: {{ .description | quote }}
    {{- end }}
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "6"
spec:
  modelRefs:
  {{- range .models }}
    {{- if kindIs "string" . }}
    - name: {{ . }}
      namespace: {{ $t.modelsNamespace }}
    {{- else }}
    - name: {{ .name }}
      namespace: {{ .namespace | default $t.modelsNamespace }}
      {{- if .tokenRateLimits }}
      tokenRateLimits:
      {{- range .tokenRateLimits }}
        - limit: {{ .limit }}
          window: {{ .window }}
      {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
  owner:
    groups:
    {{- range .groups }}
      - name: {{ . }}
    {{- end }}
  priority: {{ .priority | default 0 }}
{{- end }}
